[package]
name = "may-container-image"
version = "0.1.0"
edition = "2024"
description = "Content-addressed GHCR references for May's container images"
license = "MIT"
publish = false

[dependencies]
sha2 = { version = "0.11.1", default-features = false }
serde_json = { version = "1.0", default-features = false, features = ["std"] }

[dev-dependencies]
tempfile = { version = "3", default-features = false, features = ["getrandom"] }
toml = { version = "1.2", default-features = false, features = ["parse", "serde"] }

[lints]
workspace = true
