[package]
name = "may-tool-dist"
version = "0.1.0"
edition = "2024"
description = "The pinned tool distribution every May execution backend prepares"
license = "MIT"
repository = "https://github.com/May-Agent/may"
publish = false
build = "build.rs"

[features]
default = []
# The script-pinned fixture distribution the workspace's `#[cfg(test)]` code
# prepares offline; a crate's `[dev-dependencies]` enable it for test builds.
test-fixtures = []

[dependencies]
# The content-addressed container image references; the combined manifest
# the image tag hashes is assembled from this crate's pin files.
may-container-image = { path = "../container-image" }
# The sandbox the distribution's `heel` binary is verified against.
heel = { version = "0.10.1", default-features = false }
aither-sandbox = { version = "0.31.0", default-features = false }
async-channel = { version = "2", default-features = false, features = ["std"] }
async-fs = { version = "2.1", default-features = false }
async-io = { version = "2.6", default-features = false }
async-process = { version = "2.5", default-features = false }
askama = { version = "0.16", default-features = false, features = ["derive", "std"] }
blocking = { version = "1", default-features = false }
fd-lock = { version = "4.0.4", default-features = false }
flate2 = { version = "1.1.11", default-features = false, features = ["rust_backend"] }
futures = { version = "0.3.34", default-features = false, features = ["std", "async-await"] }
futures-lite = { version = "2.6", default-features = false, features = ["race", "std"] }
hex = { version = "0.4", default-features = false, features = ["alloc"] }
lzma-rust2 = { version = "0.25.0", default-features = false, features = ["std", "xz"] }
percent-encoding = { version = "2.3", default-features = false, features = ["std"] }
semver = { version = "1.0.28", default-features = false, features = ["std", "serde"] }
serde = { version = "1.0", default-features = false, features = ["std", "derive"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
sha2 = { version = "0.11.1", default-features = false }
shell-words = { version = "1.1", default-features = false, features = ["std"] }
tar = { version = "0.4", default-features = false }
tempfile = { version = "3.24.0", default-features = false, features = ["getrandom"] }
thiserror = { version = "2", default-features = false, features = ["std"] }
tracing = { version = "0.1", default-features = false, features = ["std", "attributes"] }
url = { version = "2.5.9", default-features = false, features = ["std"] }
zenwave = { version = "0.12", git = "https://github.com/zen-rs/zenwave", branch = "main", default-features = false, features = ["hyper-backend", "rustls-ring", "ws", "http2", "http3"] }
zip = { version = "9.8.2", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[build-dependencies]
may-container-image = { path = "../container-image" }

[dev-dependencies]
executor-core = { version = "0.7", default-features = false, features = ["std", "tokio"] }
# Builds the tar.xz artifacts the distribution tests extract.
lzma-rust2 = { version = "0.25.0", default-features = false, features = ["std", "xz", "encoder"] }
schemars = { version = "1.0", default-features = false, features = ["derive", "std"] }
tokio = { version = "1", default-features = false, features = ["io-util", "macros", "net", "rt", "rt-multi-thread"] }

[lints]
workspace = true
