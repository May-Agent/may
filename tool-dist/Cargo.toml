[package]
name = "may-tool-dist"
version = "0.1.0"
edition = "2024"
description = "The pinned tool distribution every May execution backend prepares"
license = "MIT"
repository = "https://github.com/May-Agent/may"
publish = false
build = "build.rs"

[features]
default = []
# The script-pinned fixture distribution the workspace's `#[cfg(test)]` code
# prepares offline; a crate's `[dev-dependencies]` enable it for test builds.
test-fixtures = []

[dependencies]
# The content-addressed container image references; the combined manifest
# the image tag hashes is assembled from this crate's pin files.
may-container-image = { path = "../container-image" }
# The sandbox the distribution's `heel` binary is verified against.
heel = { version = "0.10.1", default-features = false }
aither-sandbox = { version = "0.31.0", features = ["code-folding", "connectivity", "jobserver"] }
async-channel = "2"
async-fs = "2.1"
async-io = "2.6"
async-process = "2.5"
askama = "0.16"
blocking = "1"
fd-lock = "4.0.4"
flate2 = "1"
futures = { version = "0.3.34", default-features = false, features = ["std", "async-await"] }
futures-lite = "2.6"
hex = { version = "0.4", default-features = false, features = ["alloc"] }
lzma-rust2 = { version = "0.24.0", default-features = false, features = ["std", "xz"] }
percent-encoding = "2.3"
semver = { version = "1.0.28", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
shell-words = "1.1"
tar = "0.4"
tempfile = "3.24.0"
thiserror = "2"
tracing = "0.1"
url = "2"
zenwave = "0.7"
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[build-dependencies]
may-container-image = { path = "../container-image" }

[dev-dependencies]
executor-core = { version = "0.7", features = ["tokio"] }
# Builds the tar.xz artifacts the distribution tests extract.
lzma-rust2 = { version = "0.24.0", default-features = false, features = ["std", "xz", "encoder"] }
schemars = { version = "1.0", features = ["derive"] }
tokio = { version = "1", features = ["full"] }

[lints]
workspace = true
