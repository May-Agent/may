[package]
name = "may-providers"
version = "0.1.0"
edition = "2024"
description = "May's model catalog: provider metadata, effort ladders and live model listings"
license = "MIT"
repository = "https://github.com/May-Agent/may"
publish = false

[dependencies]
# The foundational wire types: model selectors and provider-facing kinds.
may-protocol = { path = "../protocol" }
# The configuration layer: `MayConfig` and provider instances.
may-config = { path = "../config" }
# The OAuth helpers the catalog reads subscription credentials from.
may-harness = { path = "../harness" }
aither-agent = { version = "0.31.0" }
aither-cloud = { version = "0.31.0" }
aither-core = { version = "0.31.0" }
aither-models = { version = "0.31.0" }
futures-lite = "2"
async-io = "2"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
futures-util = { version = "0.3", default-features = false }
aither-codex = "0.31.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
tracing = "0.1"

[lints]
workspace = true
