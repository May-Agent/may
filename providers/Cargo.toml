[package]
name = "may-providers"
version = "0.1.0"
edition = "2024"
description = "May's model catalog: provider metadata, effort ladders and live model listings"
license = "MIT"
repository = "https://github.com/May-Agent/may"
publish = false

[dependencies]
# The foundational wire types: model selectors and provider-facing kinds.
may-protocol = { path = "../protocol" }
# The configuration layer: `MayConfig` and provider instances.
may-config = { path = "../config" }
# The OAuth helpers the catalog reads subscription credentials from.
may-harness = { path = "../harness" }
aither-cloud = { version = "0.31.0", default-features = false }
aither-core = { version = "0.31.0", default-features = false, features = ["std", "derive", "serde"] }
aither-models = { version = "0.31.0", default-features = false }
futures-lite = { version = "2", default-features = false, features = ["race", "std"] }
async-io = { version = "2", default-features = false }
zenwave = { version = "0.12", git = "https://github.com/zen-rs/zenwave", branch = "main", default-features = false, features = ["hyper-backend", "rustls-ring", "ws", "http2", "http3"] }
futures-util = { version = "0.3", default-features = false }
aither-codex = { version = "0.31.0", default-features = false }
serde = { version = "1.0", default-features = false, features = ["std", "derive"] }
thiserror = { version = "2", default-features = false, features = ["std"] }
tracing = { version = "0.1", default-features = false, features = ["std", "attributes"] }

[lints]
workspace = true
