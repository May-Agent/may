[package]
name = "may-git-forge"
version = "0.1.0"
edition = "2024"
description = "May's git forge layer: the GitHub and GitLab clients and check views behind `pr` and `ci`"
license = "MIT"
repository = "https://github.com/May-Agent/may"
publish = false

[dependencies]
# The wire types the forge views share.
may-protocol = { path = "../protocol" }
# The configuration layer: forge coordinates and host git.
may-config = { path = "../config" }
# The persisted store CI rows and PR state live in.
may-db = { path = "../db" }
# The issue backends' forge REST clients and the workspace model.
may-client = { path = "../client" }
askama = "0.16"
async-io = "2.6"
async-process = "2.5"
blocking = "1"
futures-lite = "2.6"
futures-util = "0.3"
jiff = { version = "0.2", features = ["serde"] }
rustix = { version = "1.1.6", default-features = false, features = ["std", "fs", "process"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
tracing = "0.1"
url = "2"
zenwave = "0.7"

[dev-dependencies]
may-protocol = { path = "../protocol", features = ["testing"] }
tempfile = "3.24.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
