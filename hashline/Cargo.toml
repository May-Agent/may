[package]
name = "may-hashline"
version = "0.1.0"
edition = "2024"
authors = ["Lexo Liu <me@lexo.cool>"]
description = "hashline: hash-anchored line search and editing for terminal-first agents"
license = "MIT"
repository = "https://github.com/May-Agent/may"
publish = false

[dependencies]
thiserror = { version = "2", default-features = false, features = ["std"] }
xxhash-rust = { version = "0.8", default-features = false, features = ["xxh32"] }
ignore = { version = "0.4", default-features = false }
grep-regex = { version = "0.1.14", default-features = false }
grep-searcher = { version = "0.1.17", default-features = false }
ast-grep-core = { version = "0.51", default-features = false }
ast-grep-language = { version = "0.51", default-features = false, features = ["builtin-parser"] }

[[bin]]
name = "search"
path = "src/bin/search.rs"

[[bin]]
name = "edit"
path = "src/bin/edit.rs"

[dev-dependencies]
tempfile = { version = "3", default-features = false, features = ["getrandom"] }

# Standalone workspace so main-workspace edits never resolve or compile
# may-hashline or its tree-sitter grammar dependency tree.
[workspace]

[profile.ci-check]
inherits = "dev"
debug = false
incremental = false

[profile.artifact]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
strip = "symbols"
