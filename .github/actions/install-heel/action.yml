name: Install Heel Runtime
description: Prepare the heel executable the sandbox tests run under, restored from the Actions cache and built from crates.io only on a miss, then export HEEL_BIN.
inputs:
  save:
    description: Whether a cache miss saves the build. Only dev saves caches, as in the Rust caches.
    default: ${{ github.ref == 'refs/heads/dev' }}
runs:
  using: composite
  steps:
    - id: version
      shell: bash
      run: |
        set -euo pipefail
        # The runtime speaks the IPC protocol of the heel library Cargo.lock pins.
        version="$(awk '$0 == "name = \"heel\"" { getline; gsub(/"/, "", $3); print $3 }' Cargo.lock)"
        test -n "${version}"
        echo "version=${version}" >> "${GITHUB_OUTPUT}"
    - id: restore
      uses: actions/cache/restore@v4
      with:
        path: ${{ runner.temp }}/heel-runtime
        key: heel-${{ steps.version.outputs.version }}-${{ runner.os }}-${{ runner.arch }}
    - if: steps.restore.outputs.cache-hit != 'true'
      shell: bash
      env:
        VERSION: ${{ steps.version.outputs.version }}
      run: cargo install heel --version "${VERSION}" --locked --debug --root "${RUNNER_TEMP}/heel-runtime" --target-dir target/heel-runtime-build
    - if: steps.restore.outputs.cache-hit != 'true' && inputs.save == 'true'
      uses: actions/cache/save@v4
      with:
        path: ${{ runner.temp }}/heel-runtime
        key: heel-${{ steps.version.outputs.version }}-${{ runner.os }}-${{ runner.arch }}
    - shell: bash
      run: |
        set -euo pipefail
        executable="${RUNNER_TEMP}/heel-runtime/bin/heel"
        "${executable}" --version
        echo "HEEL_BIN=${executable}" >> "${GITHUB_ENV}"
