name: Run archived tests
description: Download the prebuilt nextest archive and run a filtered (optionally sharded) subset without compiling Rust.
inputs:
  filter:
    description: Nextest filterset expression passed to `-E`.
    required: true
  shard:
    description: 1-based shard index (omit for unsharded runs).
    required: false
    default: ''
  total-shards:
    description: Total number of parallel shards (required when `shard` is set).
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: Stop a superseded merge group
      if: github.event_name == 'merge_group'
      shell: bash
      run: |
        if ! git ls-remote --exit-code "https://github.com/${{ github.repository }}" "${{ github.ref }}" > /dev/null; then
          echo "::error::${{ github.ref }} no longer exists; the merge queue superseded this group"
          exit 1
        fi
    - name: Enable unprivileged user namespaces
      if: runner.os == 'Linux'
      shell: bash
      run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
    - name: Free runner disk
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo bash -c 'for dir in /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL; do
          mv "$dir" "/tmp/gc-$(basename "$dir")" 2>/dev/null || true
        done
        rm -rf /tmp/gc-* &'
    - name: Raise macOS open-file limits
      if: runner.os == 'macOS'
      shell: bash
      run: |
        sudo sysctl -w kern.maxfiles=200000 kern.maxfilesperproc=65536 >/dev/null 2>&1 || true
        sudo launchctl limit maxfiles 65536 200000 >/dev/null 2>&1 || true
    - uses: ./.github/actions/restore-test-downloads
    - name: Download the nextest archive
      uses: actions/download-artifact@v4
      with:
        name: tests-archive-${{ runner.os == 'macOS' && 'macos' || 'linux' }}-${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}
        path: ${{ runner.temp }}/tests-archive
    - uses: taiki-e/install-action@nextest
    - name: cargo nextest
      shell: bash
      env:
        NEXTEST_FILTER: ${{ inputs.filter }}
        NEXTEST_SHARD: ${{ inputs.shard }}
        NEXTEST_TOTAL_SHARDS: ${{ inputs.total-shards }}
      run: |
        ulimit -n 65536 2>/dev/null || true
        args=(
          --archive-file "${{ runner.temp }}/tests-archive/tests-archive.tar.zst"
          --workspace-remap .
          -E "${NEXTEST_FILTER}"
        )
        if [ "${{ runner.os }}" = "macOS" ]; then
          args+=(--test-threads 6)
        fi
        if [ -n "${NEXTEST_SHARD}" ]; then
          args+=(--partition "count:${NEXTEST_SHARD}/${NEXTEST_TOTAL_SHARDS}")
        fi
        cargo nextest run "${args[@]}"
