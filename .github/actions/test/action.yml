name: Test
description: Build and test the workspace on the runner it runs on. The check job names are fixed by the ruleset, so each runner has a job of its own around these steps.
inputs:
  cargo-flags:
    description: Target selection flags passed to cargo build and cargo nextest run.
    required: false
    default: '--all-targets'
  upload-may:
    description: Whether to pack and upload target/debug/may as an artifact.
    required: false
    default: 'true'
  verify-baseline-tools:
    description: Whether to run the ignored baseline tools acceptance test after nextest.
    required: false
    default: 'false'
  upload-e2e-bin:
    description: Whether to pack and upload the terminal_first_e2e test binary for the container-acceptance job to run without compiling.
    required: false
    default: 'false'
runs:
  using: composite
  steps:
    # A rebuilt merge queue deletes its old group branches but leaves their
    # runs queued; such a run ends here instead of holding a runner.
    - name: Stop a superseded merge group
      if: github.event_name == 'merge_group'
      shell: bash
      run: |
        if ! git ls-remote --exit-code "https://github.com/${{ github.repository }}" "${{ github.ref }}" > /dev/null; then
          echo "::error::${{ github.ref }} no longer exists; the merge queue superseded this group"
          exit 1
        fi
    # mv returns at once and the delete runs in the background while the
    # toolchain installs; rm -rf used to block checkout for up to two minutes.
    - name: Free runner disk
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo bash -c 'for dir in /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL; do
          mv "$dir" "/tmp/gc-$(basename "$dir")" 2>/dev/null || true
        done
        rm -rf /tmp/gc-* &'
    # The default linker spends minutes on the multi-GB test binaries; mold
    # is preinstalled on the hosted runners and links them in seconds.
    - name: Link test binaries with mold
      if: runner.os == 'Linux' && runner.arch == 'X64'
      shell: bash
      run: |
        if command -v mold > /dev/null; then
          echo "RUSTFLAGS=-C link-arg=-fuse-ld=mold" >> "${GITHUB_ENV}"
        fi
    - uses: dtolnay/rust-toolchain@stable
    # Only main saves; a PR or merge-group cache lives in a scope nothing else
    # restores, and its size evicts main's under the cache limit. Keyed by the
    # job id (`test-ubuntu`, `test-macos`), it is the one Rust cache per OS,
    # so main's caches fit under the limit together.
    - uses: Swatinem/rust-cache@v2
      with:
        save-if: ${{ github.ref == 'refs/heads/main' }}
    # rust-cache prunes the files under target/tmp but keeps its directories,
    # so a restored cache holds an empty skeleton of the tests' shared tool
    # cache that the tests would take for a prepared one.
    - name: Drop restored test scratch
      shell: bash
      run: |
        chmod -R u+w target/tmp 2>/dev/null || true
        rm -rf target/tmp
    # The pinned tool artifacts, their prepared runtimes and heel, which the
    # tests download from GitHub releases on a miss.
    - id: downloads
      uses: ./.github/actions/restore-test-downloads
    # rav1e's x86_64 assembly is built with nasm.
    - name: Install nasm
      if: runner.os == 'Linux' && runner.arch == 'X64'
      uses: ./.github/actions/install-nasm
    # Builds the test targets the nextest step runs, so that step compiles
    # nothing; `cargo build` would build the non-test libraries instead, which
    # no test uses. The integration tests and `--all-targets` still build the
    # `may` binary the next steps upload.
    - name: cargo build
      shell: bash
      run: cargo test --locked ${{ inputs.cargo-flags }} --no-run --timings
    # Every run keeps the debug may it built, so a commit can be tested on
    # another machine without building it there. It is packed as a tarball
    # because artifacts drop the executable bit.
    - name: Pack the debug may
      if: inputs.upload-may == 'true'
      shell: bash
      run: tar -czf may-debug.tar.gz -C target/debug may
    - name: Upload the debug may
      if: inputs.upload-may == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: may-debug-${{ runner.os == 'macOS' && 'macos' || 'linux' }}-${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}
        path: may-debug.tar.gz
        retention-days: 90
    - name: Pack the e2e test binary
      if: inputs.upload-e2e-bin == 'true'
      shell: bash
      run: |
        path="$(find target/debug -type f -name 'terminal_first_e2e-*' ! -name '*.d' | head -1)"
        tar -czf e2e-test-bin.tar.gz -C "$(dirname "$path")" "$(basename "$path")"
    - name: Upload the e2e test binary
      if: inputs.upload-e2e-bin == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: e2e-test-bin-${{ runner.os == 'macOS' && 'macos' || 'linux' }}-${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}
        path: e2e-test-bin.tar.gz
        retention-days: 30
    # The merge queue already tested the tree a push to main lands, so that
    # push only builds, to seed main's caches; it still tests when the test
    # downloads missed, since the tests are what fetch them.
    #
    # nextest runs every test of every binary in one pool, where `cargo test`
    # runs the binaries one after another. May has no Rust doc-tests (its doc
    # code blocks are text, bash, toml or `ignore`), so there is no
    # `cargo test --doc` step.
    - if: github.event_name != 'push' || steps.downloads.outputs.tools-hit != 'true'
      uses: taiki-e/install-action@nextest
    - name: cargo nextest
      if: github.event_name != 'push' || steps.downloads.outputs.tools-hit != 'true'
      shell: bash
      run: cargo nextest run --locked ${{ inputs.cargo-flags }} --timings
    - name: Verify baseline tools
      if: inputs.verify-baseline-tools == 'true' && (github.event_name != 'push' || steps.downloads.outputs.tools-hit != 'true')
      shell: bash
      run: >
        cargo nextest run --locked --test terminal_first_e2e --run-ignored only
        -E 'test(=the_baseline_tools_pass_their_acceptance_script_in_the_sandbox)'
        --no-capture
    - name: Upload cargo timings
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: cargo-timings-${{ github.job }}
        path: target/cargo-timings/
    - name: Drop test-written shims before saving cache
      if: success() && steps.downloads.outputs.tools-hit != 'true' && github.ref == 'refs/heads/main'
      shell: bash
      run: rm -rf "${{ steps.downloads.outputs.tools-path }}"/runtimes/*/shims
    - if: success() && steps.downloads.outputs.tools-hit != 'true' && github.ref == 'refs/heads/main'
      uses: actions/cache/save@v4
      with:
        path: ${{ steps.downloads.outputs.tools-path }}
        key: ${{ steps.downloads.outputs.tools-key }}
    # The Rust cache this job saves is written after the run, so every
    # earlier generation under the job's prefix can go now; without this the
    # generations accumulate past the repository's cache quota and evict the
    # hot one.
    - name: Retire superseded Rust caches
      if: github.ref == 'refs/heads/main'
      shell: bash
      run: |
        prefix="v0-rust-${{ github.job }}-"
        gh api --paginate "repos/${{ github.repository }}/actions/caches?key=${prefix}" \
          -q ".actions_caches[] | select(.key | startswith(\"${prefix}\")) | .id" \
          | while read -r id; do
              gh api -X DELETE "repos/${{ github.repository }}/actions/caches/${id}" || true
            done
