name: Test
description: Build and test the workspace on the runner it runs on. The check job names are fixed by the ruleset, so each runner has a job of its own around these steps.
runs:
  using: composite
  steps:
    # A rebuilt merge queue deletes its old group branches but leaves their
    # runs queued; such a run ends here instead of holding a runner.
    - name: Stop a superseded merge group
      if: github.event_name == 'merge_group'
      shell: bash
      run: |
        if ! git ls-remote --exit-code "https://github.com/${{ github.repository }}" "${{ github.ref }}" > /dev/null; then
          echo "::error::${{ github.ref }} no longer exists; the merge queue superseded this group"
          exit 1
        fi
    - name: Free runner disk
      if: runner.os == 'Linux'
      shell: bash
      run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
    - uses: dtolnay/rust-toolchain@stable
    # Only main saves; a PR or merge-group cache lives in a scope nothing else
    # restores, and its size evicts main's under the cache limit. This is the
    # one Rust cache per OS that `verify-tools` and `container-acceptance`
    # restore too, so main's caches fit under the limit together.
    - uses: Swatinem/rust-cache@v2
      with:
        save-if: ${{ github.ref == 'refs/heads/main' }}
        shared-key: ci-test
    # rust-cache prunes the files under target/tmp but keeps its directories,
    # so a restored cache holds an empty skeleton of the tests' shared tool
    # cache that the tests would take for a prepared one.
    - name: Drop restored test scratch
      shell: bash
      run: |
        chmod -R u+w target/tmp 2>/dev/null || true
        rm -rf target/tmp
    # The pinned tool artifacts, their prepared runtimes and heel, which the
    # tests download from GitHub releases on a miss.
    - id: downloads
      uses: ./.github/actions/restore-test-downloads
    # rav1e's x86_64 assembly is built with nasm.
    - name: Install nasm
      if: runner.os == 'Linux' && runner.arch == 'X64'
      uses: ./.github/actions/install-nasm
    - name: cargo build
      shell: bash
      run: cargo build --locked --all-targets --timings
    # Every run keeps the debug may it built, so a commit can be tested on
    # another machine without building it there. It is packed as a tarball
    # because artifacts drop the executable bit.
    - name: Pack the debug may
      shell: bash
      run: tar -czf may-debug.tar.gz -C target/debug may
    - name: Upload the debug may
      uses: actions/upload-artifact@v4
      with:
        name: may-debug-${{ runner.os == 'macOS' && 'macos' || 'linux' }}-${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}
        path: may-debug.tar.gz
        retention-days: 90
    # The merge queue already tested the tree a push to main lands, so that
    # push only builds, to seed main's caches; it still tests when the test
    # downloads missed, since the tests are what fetch them.
    #
    # nextest runs every test of every binary in one pool, where `cargo test`
    # runs the binaries one after another. May has no Rust doc-tests (its doc
    # code blocks are text, bash, toml or `ignore`), so there is no
    # `cargo test --doc` step.
    - if: github.event_name != 'push' || steps.downloads.outputs.tools-hit != 'true'
      uses: taiki-e/install-action@nextest
    - name: cargo nextest
      if: github.event_name != 'push' || steps.downloads.outputs.tools-hit != 'true'
      shell: bash
      run: cargo nextest run --locked --all-targets --timings
    - name: Upload cargo timings
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: cargo-timings-${{ github.job }}
        path: target/cargo-timings/
    - if: success() && steps.downloads.outputs.tools-hit != 'true' && github.ref == 'refs/heads/main'
      uses: actions/cache/save@v4
      with:
        path: ${{ steps.downloads.outputs.tools-path }}
        key: ${{ steps.downloads.outputs.tools-key }}
