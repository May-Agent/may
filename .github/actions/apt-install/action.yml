name: Install apt packages
description: Install Ubuntu packages on a hosted runner from archive.ubuntu.com rather than the runner's Azure mirror.
inputs:
  packages:
    description: Space-separated package names.
    required: true
runs:
  using: composite
  steps:
    # The hosted image lists azure.archive.ubuntu.com first in
    # /etc/apt/apt-mirrors.txt, and runners lose that host for hours at a time
    # (actions/runner-images#6894, #7048), failing every install. Without it
    # apt goes to the next entry, archive.ubuntu.com.
    - shell: bash
      env:
        PACKAGES: ${{ inputs.packages }}
      run: |
        set -euo pipefail
        sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
        sudo apt-get update
        # shellcheck disable=SC2086 # PACKAGES is a word list.
        sudo apt-get install -y --no-install-recommends ${PACKAGES}
