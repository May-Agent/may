name: Install bun
description: Put the pinned bun on PATH, restored from the Actions cache and downloaded from the bun release only on a miss.
inputs:
  version:
    description: bun release to install; the digests below pin it.
    default: "1.4.4"
  save:
    description: Whether a cache miss saves the download. Only dev saves caches, as in the Rust caches.
    default: ${{ github.ref == 'refs/heads/dev' }}
runs:
  using: composite
  steps:
    - id: asset
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        # The digests are the release's published SHASUMS256.txt values for
        # 1.4.4; a version bump replaces them with the new release's.
        case "${RUNNER_OS}-${RUNNER_ARCH}" in
          Linux-X64) platform=linux-x64; sha256=bf8ccbfb2b0b80159e0f9a6d15c55317add8077534dbc6130a3edb52fccb395c ;;
          Linux-ARM64) platform=linux-aarch64; sha256=baa6bb36f51d6e58561e02bbea825038a9df454f673d6d776e8bbf86f8c7850e ;;
          macOS-ARM64) platform=darwin-aarch64; sha256=c240d7f0ccb90c263a849fcdb09b7ee62630d921348ed6aafda86b9d577bc510 ;;
          *) echo "no pinned bun for ${RUNNER_OS}-${RUNNER_ARCH}" >&2; exit 1 ;;
        esac
        {
          echo "platform=${platform}"
          echo "sha256=${sha256}"
          echo "directory=${RUNNER_TEMP}/bun"
        } >> "${GITHUB_OUTPUT}"
    - id: restore
      uses: actions/cache/restore@v4
      with:
        path: ${{ runner.temp }}/bun
        key: bun-${{ inputs.version }}-${{ runner.os }}-${{ runner.arch }}
    - if: steps.restore.outputs.cache-hit != 'true'
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        PLATFORM: ${{ steps.asset.outputs.platform }}
        SHA256: ${{ steps.asset.outputs.sha256 }}
        DIRECTORY: ${{ steps.asset.outputs.directory }}
      run: |
        set -euo pipefail
        archive="${RUNNER_TEMP}/bun-${PLATFORM}.zip"
        curl --fail --location --silent --show-error --retry 5 --retry-all-errors \
          --output "${archive}" \
          "https://github.com/oven-sh/bun/releases/download/bun-v${VERSION}/bun-${PLATFORM}.zip"
        echo "${SHA256}  ${archive}" | (sha256sum --check - 2>/dev/null || shasum -a 256 --check -)
        mkdir -p "${DIRECTORY}/bin"
        unzip -q -o -j "${archive}" "bun-${PLATFORM}/bun" -d "${DIRECTORY}/bin"
        chmod +x "${DIRECTORY}/bin/bun"
        # The release ships bun alone; bunx is bun invoked under that name.
        ln -sf bun "${DIRECTORY}/bin/bunx"
    - if: steps.restore.outputs.cache-hit != 'true' && inputs.save == 'true'
      uses: actions/cache/save@v4
      with:
        path: ${{ runner.temp }}/bun
        key: bun-${{ inputs.version }}-${{ runner.os }}-${{ runner.arch }}
    - shell: bash
      env:
        DIRECTORY: ${{ steps.asset.outputs.directory }}
      run: |
        set -euo pipefail
        echo "${DIRECTORY}/bin" >> "${GITHUB_PATH}"
        "${DIRECTORY}/bin/bun" --version
        "${DIRECTORY}/bin/bunx" --version
