name: CI

on:
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Selects the jobs the change reads: the shared lexoliu/affected-crates
  # tool marks the workspace packages the merge-base diff affects plus every
  # reverse dependency (path rules in .github/affected-rules.toml), and
  # .github/scripts/affected.py turns its report into the job gates and the
  # cargo `-p` selection below. The ruleset requires one check, `CI result`,
  # which needs every job below and passes when each of them succeeded or was
  # skipped by its job-level `if`. Should this job itself fail, the others run,
  # so a broken scope never skips coverage; the tool step is allowed to fail
  # for the same reason — affected.py then widens the gate to the whole
  # workspace.
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      rust: ${{ steps.scope.outputs.rust }}
      sed: ${{ steps.scope.outputs.sed }}
      hashline: ${{ steps.scope.outputs.hashline }}
      fmt: ${{ steps.scope.outputs.fmt }}
      clippy: ${{ steps.scope.outputs.clippy }}
      ui-clippy: ${{ steps.scope.outputs.ui-clippy }}
      test: ${{ steps.scope.outputs.test }}
      unit-test: ${{ steps.scope.outputs.unit-test }}
      e2e: ${{ steps.scope.outputs.e2e }}
      web_ui: ${{ steps.scope.outputs.web_ui }}
      acceptance: ${{ steps.scope.outputs.acceptance }}
      packages: ${{ steps.scope.outputs.packages }}
      package-args: ${{ steps.scope.outputs.package-args }}
      linux-package-args: ${{ steps.scope.outputs.linux-package-args }}
      cargo-flags: ${{ steps.scope.outputs.cargo-flags }}
      linux-cargo-flags: ${{ steps.scope.outputs.linux-cargo-flags }}
      unit-cargo-flags: ${{ steps.scope.outputs.unit-cargo-flags }}
      linux-unit-cargo-flags: ${{ steps.scope.outputs.linux-unit-cargo-flags }}
      ui-args: ${{ steps.scope.outputs.ui-args }}
    steps:
      # The diff needs the base commit, which a shallow clone lacks.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The affected-crates tool resolves the package graph with cargo.
      - uses: dtolnay/rust-toolchain@stable
      # A pull request measures from the merge base with its base branch; a
      # merge group from the main commit it is built on; a push from the commit
      # main pointed at before. A push with no previous commit (all zeros) has no
      # base, so it selects everything.
      - id: base
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          GROUP_BASE: ${{ github.event.merge_group.base_sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          case "${EVENT}" in
            pull_request) base="${PR_BASE}" ;;
            merge_group) base="${GROUP_BASE}" ;;
            push) base="${PUSH_BEFORE}" ;;
            *) echo "::error::unexpected event ${EVENT}"; exit 1 ;;
          esac
          if [ "${base}" = 0000000000000000000000000000000000000000 ]; then
            base=""
          fi
          echo "base=${base}" >> "${GITHUB_OUTPUT}"
      # A failed step leaves `report` empty, and affected.py then widens to
      # the whole workspace instead of failing the gate.
      - name: Select the affected packages
        id: shared
        if: steps.base.outputs.base != ''
        continue-on-error: true
        uses: lexoliu/affected-crates@v0.0.1
        with:
          base: ${{ steps.base.outputs.base }}
          rules: .github/affected-rules.toml
          locked: "true"
      # The report is written to disk rather than passed through the
      # environment so a large diff cannot overflow MAX_ARG_STRLEN.
      - id: scope
        run: |
          report_file="${RUNNER_TEMP}/affected-report.json"
          cat <<'__MAY_AFFECTED_REPORT__' > "${report_file}"
          ${{ steps.shared.outputs.report }}
          __MAY_AFFECTED_REPORT__
          python3 .github/scripts/affected.py --base "${{ steps.base.outputs.base }}" --report-file "${report_file}"

  # The container tests in container-acceptance pull the workspace image, whose
  # tag is a content hash of its inputs; it is built and pushed here first, and
  # skipped when that tag already exists. Same scope gate as the tests.
  container-image:
    needs: scope
    if: ${{ !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.acceptance == 'true') }}
    uses: ./.github/workflows/container-image.yml
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

  fmt:
    needs: scope
    if: ${{ !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.fmt == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: cargo fmt --check
        run: |
          if [ "${{ needs.scope.outputs.packages }}" = "workspace" ] || [ "${{ needs.scope.result }}" != "success" ]; then
            cargo fmt --check
          elif [ -n "${{ needs.scope.outputs.linux-package-args }}" ]; then
            cargo fmt --check ${{ needs.scope.outputs.linux-package-args }}
          fi
          if [ "${{ needs.scope.outputs.sed }}" = "true" ] || [ "${{ needs.scope.result }}" != "success" ]; then
            cargo fmt --manifest-path sed/Cargo.toml -- --check
          fi
          if [ "${{ needs.scope.outputs.hashline }}" = "true" ] || [ "${{ needs.scope.result }}" != "success" ]; then
            cargo fmt --manifest-path hashline/Cargo.toml -- --check
          fi

  # Default and `--features ui` clippy share one runner so the second pass
  # reuses `target/` and compiled build scripts from the first. `sed/` and
  # `hashline/` stay separate as their own standalone workspaces.
  clippy:
    name: clippy
    needs: scope
    if: ${{ !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.rust == 'true' || needs.scope.outputs.ui-clippy == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Stop a superseded merge group
        if: github.event_name == 'merge_group'
        run: |
          if ! git ls-remote --exit-code "https://github.com/${{ github.repository }}" "${{ github.ref }}" > /dev/null; then
            echo "::error::${{ github.ref }} no longer exists; the merge queue superseded this group"
            exit 1
          fi
      - name: Free runner disk
        run: |
          sudo bash -c 'for dir in /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL; do
            mv "$dir" "/tmp/gc-$(basename "$dir")" 2>/dev/null || true
          done
          rm -rf /tmp/gc-* &'
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: water-rs/stow@main
        with:
          shared-key: ci-clippy
          local-crates-io-max-bytes: '1610612736'
      - name: Install nasm
        uses: ./.github/actions/install-nasm
      - name: cargo clippy (default features)
        if: needs.scope.result != 'success' || needs.scope.outputs.rust == 'true'
        run: cargo clippy --locked --profile ci-check --all-targets ${{ needs.scope.outputs.linux-package-args || '--workspace' }} --timings -- -D warnings
      - name: Install bun
        if: needs.scope.result != 'success' || needs.scope.outputs.ui-clippy == 'true'
        uses: ./.github/actions/install-bun
      - name: bun install
        if: needs.scope.result != 'success' || needs.scope.outputs.ui-clippy == 'true'
        working-directory: web-ui
        run: bun install --frozen-lockfile
      - name: cargo clippy (ui)
        if: needs.scope.result != 'success' || needs.scope.outputs.ui-clippy == 'true'
        run: cargo clippy --locked --profile ci-check --all-targets --features ui ${{ needs.scope.outputs.ui-args || '--workspace' }} --timings -- -D warnings
      - name: Upload cargo timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-timings-clippy
          path: target/cargo-timings/
      - name: Report stow cache stats
        if: always()
        run: stow stats || true

  clippy-sed:
    name: clippy (sed)
    needs: scope
    if: ${{ !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.sed == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: water-rs/stow@main
        with:
          shared-key: ci-sed
          workspaces: sed
      - name: cargo clippy (sed)
        run: cargo clippy --locked --manifest-path sed/Cargo.toml --profile ci-check --all-targets -- -D warnings
      - name: Report stow cache stats
        if: always()
        run: stow stats || true

  test-sed-ubuntu:
    name: test-sed (ubuntu-latest)
    needs: scope
    if: ${{ !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.sed == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: water-rs/stow@main
        with:
          shared-key: ci-sed
          workspaces: sed
      - uses: taiki-e/install-action@nextest
      - name: cargo nextest (sed)
        run: cargo nextest run --locked --manifest-path sed/Cargo.toml --all-targets
      - name: Report stow cache stats
        if: always()
        run: stow stats || true

  test-sed-macos:
    name: test-sed (macos-latest)
    needs: scope
    if: ${{ !cancelled() && github.event_name != 'pull_request' && (needs.scope.result != 'success' || needs.scope.outputs.sed == 'true') }}
    runs-on: macos-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: water-rs/stow@main
        with:
          shared-key: ci-sed
          workspaces: sed
      - uses: taiki-e/install-action@nextest
      - name: cargo nextest (sed)
        run: cargo nextest run --locked --manifest-path sed/Cargo.toml --all-targets
      - name: Report stow cache stats
        if: always()
        run: stow stats || true

  clippy-hashline:
    name: clippy (hashline)
    needs: scope
    if: ${{ !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.hashline == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: water-rs/stow@main
        with:
          shared-key: ci-hashline
          workspaces: hashline
      - name: cargo clippy (hashline)
        run: cargo clippy --locked --manifest-path hashline/Cargo.toml --profile ci-check --all-targets -- -D warnings
      - name: Report stow cache stats
        if: always()
        run: stow stats || true

  test-hashline-ubuntu:
    name: test-hashline (ubuntu-latest)
    needs: scope
    if: ${{ !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.hashline == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: water-rs/stow@main
        with:
          shared-key: ci-hashline
          workspaces: hashline
      - uses: taiki-e/install-action@nextest
      - name: cargo nextest (hashline)
        run: cargo nextest run --locked --manifest-path hashline/Cargo.toml --all-targets
      - name: cargo build (hashline)
        run: cargo build --locked --manifest-path hashline/Cargo.toml --bins
      - name: Pack the debug hashline binaries
        env:
          GZIP: '-1'
        run: tar -czf "${{ runner.temp }}/hashline-debug.tar.gz" -C hashline/target/debug search edit
      - name: Upload the debug hashline binaries
        uses: actions/upload-artifact@v4
        with:
          name: hashline-debug-linux-x64
          path: ${{ runner.temp }}/hashline-debug.tar.gz
          retention-days: 90
          if-no-files-found: error
      - name: Report stow cache stats
        if: always()
        run: stow stats || true

  test-hashline-macos:
    name: test-hashline (macos-latest)
    needs: scope
    if: ${{ !cancelled() && github.event_name != 'pull_request' && (needs.scope.result != 'success' || needs.scope.outputs.hashline == 'true') }}
    runs-on: macos-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: water-rs/stow@main
        with:
          shared-key: ci-hashline
          workspaces: hashline
      - uses: taiki-e/install-action@nextest
      - name: cargo nextest (hashline)
        run: cargo nextest run --locked --manifest-path hashline/Cargo.toml --all-targets
      - name: cargo build (hashline)
        run: cargo build --locked --manifest-path hashline/Cargo.toml --bins
      - name: Pack the debug hashline binaries
        env:
          GZIP: '-1'
        run: tar -czf "${{ runner.temp }}/hashline-debug.tar.gz" -C hashline/target/debug search edit
      - name: Upload the debug hashline binaries
        uses: actions/upload-artifact@v4
        with:
          name: hashline-debug-macos-arm64
          path: ${{ runner.temp }}/hashline-debug.tar.gz
          retention-days: 90
          if-no-files-found: error
      - name: Report stow cache stats
        if: always()
        run: stow stats || true

  # One build per OS compiles and archives every affected crate plus `may-agent`
  # when `e2e` is on, then fans out unit tests, 4 E2E shards and Container
  # Acceptance from that archive with zero Rust compilation. When `e2e` is off
  # (e.g. a client-only diff), `build-tests` runs the unit tests inline instead.
  build-tests-ubuntu:
    name: build-tests (ubuntu-latest)
    needs: scope
    if: ${{ !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.e2e == 'true' || needs.scope.outputs.linux-unit-cargo-flags != '') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write
    outputs:
      run-tests: ${{ steps.build.outputs.run-tests }}
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Dependencies keep Cargo's default profile settings so they match stow's
      # public prebuilt cache; ./.github/actions/build-tests sets debug=0,
      # strip="debuginfo", and codegen-units=16 only on workspace packages via
      # ${CARGO_HOME}/config.toml.
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
      - id: build
        uses: ./.github/actions/build-tests
        with:
          e2e: ${{ (needs.scope.result != 'success' || needs.scope.outputs.e2e == 'true') && 'true' || 'false' }}
          cargo-flags: ${{ needs.scope.outputs.linux-cargo-flags || '--workspace --all-targets' }}

  test-ubuntu-unit:
    name: test-unit (ubuntu-latest)
    needs: [scope, build-tests-ubuntu]
    if: ${{ !cancelled() && needs.build-tests-ubuntu.result == 'success' && needs.build-tests-ubuntu.outputs.run-tests == 'true' && (needs.scope.result != 'success' || needs.scope.outputs.linux-unit-cargo-flags != '') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/run-tests
        with:
          filter: 'not package(may-agent)'

  test-ubuntu-e2e:
    name: test-e2e (ubuntu-latest, ${{ matrix.shard }}/4)
    needs: [scope, build-tests-ubuntu]
    if: ${{ !cancelled() && needs.build-tests-ubuntu.result == 'success' && needs.build-tests-ubuntu.outputs.run-tests == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/run-tests
        with:
          filter: 'package(may-agent)'
          shard: ${{ matrix.shard }}
          total-shards: 4

  # Pull requests skip macOS jobs; the merge queue runs them on the tree that
  # lands on main, using one archive build -> unit + 2 E2E shards (keeping peak
  # concurrent macOS runners at 3 to avoid runner-pool queuing delays while both
  # E2E shards finish under `test-unit`'s wall time).
  build-tests-macos:
    name: build-tests (macos-latest)
    needs: scope
    if: ${{ !cancelled() && github.event_name != 'pull_request' && (needs.scope.result != 'success' || needs.scope.outputs.e2e == 'true' || needs.scope.outputs.unit-cargo-flags != '') }}
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write
    outputs:
      run-tests: ${{ steps.build.outputs.run-tests }}
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
      - id: build
        uses: ./.github/actions/build-tests
        with:
          e2e: ${{ (needs.scope.result != 'success' || needs.scope.outputs.e2e == 'true') && 'true' || 'false' }}
          cargo-flags: ${{ needs.scope.outputs.cargo-flags || '--workspace --all-targets' }}

  test-macos-unit:
    name: test-unit (macos-latest)
    needs: [scope, build-tests-macos]
    if: ${{ !cancelled() && github.event_name != 'pull_request' && needs.build-tests-macos.result == 'success' && needs.build-tests-macos.outputs.run-tests == 'true' && (needs.scope.result != 'success' || needs.scope.outputs.unit-cargo-flags != '') }}
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/run-tests
        with:
          filter: 'not package(may-agent)'

  test-macos-e2e:
    name: test-e2e (macos-latest, ${{ matrix.shard }}/2)
    needs: [scope, build-tests-macos]
    if: ${{ !cancelled() && github.event_name != 'pull_request' && needs.build-tests-macos.result == 'success' && needs.build-tests-macos.outputs.run-tests == 'true' }}
    runs-on: macos-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/run-tests
        with:
          filter: 'package(may-agent)'
          shard: ${{ matrix.shard }}
          total-shards: 2

  # Starts as soon as `container-image` and `build-tests-ubuntu` finish,
  # running in parallel with `test-ubuntu-unit` and all 4 `test-ubuntu-e2e`
  # shards.
  container-acceptance:
    name: Container Acceptance
    needs: [scope, container-image, build-tests-ubuntu]
    if: ${{ !cancelled() && needs.container-image.result == 'success' && needs.build-tests-ubuntu.result == 'success' && (needs.scope.result != 'success' || needs.scope.outputs.acceptance == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Enable unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Free runner disk
        run: |
          sudo bash -c 'for dir in /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL; do
            mv "$dir" "/tmp/gc-$(basename "$dir")" 2>/dev/null || true
          done
          rm -rf /tmp/gc-* &'
      - uses: actions/checkout@v4
      - id: downloads
        uses: ./.github/actions/restore-test-downloads
      - name: Download the nextest archive
        uses: actions/download-artifact@v4
        with:
          name: tests-archive-linux-x64
          path: ${{ runner.temp }}/tests-archive
      - uses: taiki-e/install-action@nextest
      - name: Run the container tests
        run: |
          cargo nextest run \
            --archive-file "${{ runner.temp }}/tests-archive/tests-archive.tar.zst" \
            --workspace-remap . \
            --run-ignored ignored-only \
            --no-capture \
            -E 'test(=a_container_command_runs_at_the_configured_nice_and_reaches_ipc) | test(=ui_stream_stop_mid_response_persists_partial_assistant_text_in_container) | test(=ui_chat_executes_terminal_and_terminal_input_round_trip_in_container) | test(=ui_chat_turns_on_one_session_prepare_tools_once_in_container) | test(=container_profile_inline_script_task_reads_its_trigger_file) | test(=container_profile_script_file_task_reads_its_trigger_file) | test(=container_and_local_commands_share_the_daemons_job_pool)'
      - name: Drop test-written shims before saving cache
        if: success() && steps.downloads.outputs.tools-hit != 'true' && github.ref == 'refs/heads/main'
        run: rm -rf "${{ steps.downloads.outputs.tools-path }}"/runtimes/*/shims
      - if: success() && steps.downloads.outputs.tools-hit != 'true' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.downloads.outputs.tools-path }}
          key: ${{ steps.downloads.outputs.tools-key }}

  web-ui:
    needs: scope
    if: ${{ !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.web_ui == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/install-bun
      - name: bun install
        working-directory: web-ui
        run: bun install --frozen-lockfile
      - name: typecheck
        working-directory: web-ui
        run: bunx tsc -b
      - name: lint
        working-directory: web-ui
        run: bun run lint
      - name: bun test
        working-directory: web-ui
        run: bun test

  result:
    # The one required check on `main`: green when every job it needs
    # succeeded or was skipped by the scope.
    name: CI result
    if: always()
    needs:
      - fmt
      - clippy
      - clippy-sed
      - test-sed-ubuntu
      - test-sed-macos
      - clippy-hashline
      - test-hashline-ubuntu
      - test-hashline-macos
      - build-tests-ubuntu
      - test-ubuntu-unit
      - test-ubuntu-e2e
      - build-tests-macos
      - test-macos-unit
      - test-macos-e2e
      - container-image
      - container-acceptance
      - web-ui
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check job results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            if [ "$result" = failure ] || [ "$result" = cancelled ]; then
              echo "::error::a needed job ended $result"
              exit 1
            fi
          done
