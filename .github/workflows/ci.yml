name: CI

on:
  pull_request:
    branches: [dev, main]
  merge_group:
    branches: [dev]
  push:
    branches: [dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: cargo fmt --check
        run: cargo fmt --check

  clippy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      # A rebuilt merge queue deletes its old group branches but leaves their
      # runs queued; such a run ends here instead of holding a runner.
      - name: Stop a superseded merge group
        if: github.event_name == 'merge_group'
        run: |
          if ! git ls-remote --exit-code "https://github.com/${{ github.repository }}" "${{ github.ref }}" > /dev/null; then
            echo "::error::${{ github.ref }} no longer exists; the merge queue superseded this group"
            exit 1
          fi
      - name: Free runner disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # The `ui` feature's build script builds and embeds web-ui with bun.
      - uses: ./.github/actions/install-bun
      - name: bun install
        working-directory: web-ui
        run: bun install --frozen-lockfile
      # rav1e's x86_64 assembly is built with nasm.
      - name: Install nasm
        if: runner.os == 'Linux' && runner.arch == 'X64'
        run: sudo apt-get update && sudo apt-get install -y nasm
      - name: cargo clippy (default features)
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: cargo clippy (ui)
        run: cargo clippy --locked --all-targets --features ui -- -D warnings

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      # Full debuginfo for this dependency tree overflows the hosted runner's disk;
      # line tables keep test backtraces readable.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      # A rebuilt merge queue deletes its old group branches but leaves their
      # runs queued; such a run ends here instead of holding a runner.
      - name: Stop a superseded merge group
        if: github.event_name == 'merge_group'
        run: |
          if ! git ls-remote --exit-code "https://github.com/${{ github.repository }}" "${{ github.ref }}" > /dev/null; then
            echo "::error::${{ github.ref }} no longer exists; the merge queue superseded this group"
            exit 1
          fi
      - name: Free runner disk
        if: runner.os == 'Linux'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # rust-cache prunes the files under target/tmp but keeps its directories,
      # so a restored cache holds an empty skeleton of the tests' shared tool
      # cache that the tests would take for a prepared one.
      - name: Drop restored test scratch
        shell: bash
        run: |
          chmod -R u+w target/tmp 2>/dev/null || true
          rm -rf target/tmp
      - uses: ./.github/actions/install-heel
      # The pinned tool artifacts, their prepared runtimes and the container
      # heel the tests download from GitHub releases on a miss.
      - id: downloads
        uses: ./.github/actions/restore-test-downloads
      # rav1e's x86_64 assembly is built with nasm.
      - name: Install nasm
        if: runner.os == 'Linux' && runner.arch == 'X64'
        run: sudo apt-get update && sudo apt-get install -y nasm
      - name: cargo build
        run: cargo build --locked --all-targets
      - name: cargo test
        run: cargo test --locked --all-targets
      - if: success() && steps.downloads.outputs.tools-hit != 'true' && github.ref == 'refs/heads/dev'
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.downloads.outputs.tools-path }}
          key: ${{ steps.downloads.outputs.tools-key }}
      - if: success() && steps.downloads.outputs.heel-hit != 'true' && github.ref == 'refs/heads/dev'
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.downloads.outputs.heel-path }}
          key: ${{ steps.downloads.outputs.heel-key }}

  web-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/install-bun
      - name: bun install
        working-directory: web-ui
        run: bun install --frozen-lockfile
      - name: typecheck
        working-directory: web-ui
        run: bunx tsc -b
      - name: lint
        working-directory: web-ui
        run: bun run lint
      - name: bun test
        working-directory: web-ui
        run: bun test
