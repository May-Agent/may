name: CI

on:
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Selects the jobs the change reads: the shared lexoliu/affected-crates
  # tool marks the workspace packages the merge-base diff affects plus every
  # reverse dependency (path rules in .github/affected-rules.toml), and
  # .github/scripts/affected.py turns its report into the job gates and the
  # cargo `-p` selection below. The ruleset requires one check, `CI result`,
  # which needs `fmt`, `clippy`, `web-ui` and both test jobs and passes when
  # each of them succeeded or was skipped by its job-level `if`. Should this
  # job itself fail, the others run, so a broken scope never skips coverage;
  # the tool step is allowed to fail for the same reason — affected.py then
  # widens the gate to the whole workspace.
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      rust: ${{ steps.scope.outputs.rust }}
      sed: ${{ steps.scope.outputs.sed }}
      fmt: ${{ steps.scope.outputs.fmt }}
      clippy: ${{ steps.scope.outputs.clippy }}
      ui-clippy: ${{ steps.scope.outputs.ui-clippy }}
      test: ${{ steps.scope.outputs.test }}
      e2e: ${{ steps.scope.outputs.e2e }}
      web_ui: ${{ steps.scope.outputs.web_ui }}
      acceptance: ${{ steps.scope.outputs.acceptance }}
      packages: ${{ steps.scope.outputs.packages }}
      package-args: ${{ steps.scope.outputs.package-args }}
      linux-package-args: ${{ steps.scope.outputs.linux-package-args }}
      cargo-flags: ${{ steps.scope.outputs.cargo-flags }}
      linux-cargo-flags: ${{ steps.scope.outputs.linux-cargo-flags }}
      ui-args: ${{ steps.scope.outputs.ui-args }}
    steps:
      # The diff needs the base commit, which a shallow clone lacks.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The affected-crates tool resolves the package graph with cargo.
      - uses: dtolnay/rust-toolchain@stable
      # A pull request measures from the merge base with its base branch; a
      # merge group from the main commit it is built on; a push from the commit
      # main pointed at before. A push with no previous commit (all zeros) has no
      # base, so it selects everything.
      - id: base
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          GROUP_BASE: ${{ github.event.merge_group.base_sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          case "${EVENT}" in
            pull_request) base="${PR_BASE}" ;;
            merge_group) base="${GROUP_BASE}" ;;
            push) base="${PUSH_BEFORE}" ;;
            *) echo "::error::unexpected event ${EVENT}"; exit 1 ;;
          esac
          if [ "${base}" = 0000000000000000000000000000000000000000 ]; then
            base=""
          fi
          echo "base=${base}" >> "${GITHUB_OUTPUT}"
      # A failed step leaves `report` empty, and affected.py then widens to
      # the whole workspace instead of failing the gate.
      - name: Select the affected packages
        id: shared
        if: steps.base.outputs.base != ''
        continue-on-error: true
        uses: lexoliu/affected-crates@v0.0.1
        with:
          base: ${{ steps.base.outputs.base }}
          rules: .github/affected-rules.toml
          locked: "true"
      # The report is written to disk rather than passed through the
      # environment so a large diff cannot overflow MAX_ARG_STRLEN.
      - id: scope
        run: |
          report_file="${RUNNER_TEMP}/affected-report.json"
          cat <<'__MAY_AFFECTED_REPORT__' > "${report_file}"
          ${{ steps.shared.outputs.report }}
          __MAY_AFFECTED_REPORT__
          python3 .github/scripts/affected.py --base "${{ steps.base.outputs.base }}" --report-file "${report_file}"

  # The container tests in container-acceptance pull the workspace image, whose
  # tag is a content hash of its inputs; it is built and pushed here first, and
  # skipped when that tag already exists. Same scope gate as the tests.
  container-image:
    needs: scope
    if: ${{ !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.acceptance == 'true') }}
    uses: ./.github/workflows/container-image.yml
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

  fmt:
    needs: scope
    if: ${{ !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.fmt == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: cargo fmt --check
        run: |
          if [ "${{ needs.scope.outputs.packages }}" = "workspace" ]; then
            cargo fmt --check
          elif [ -n "${{ needs.scope.outputs.linux-package-args }}" ]; then
            cargo fmt --check ${{ needs.scope.outputs.linux-package-args }}
          fi
          if [ "${{ needs.scope.outputs.sed }}" = "true" ]; then
            cargo fmt --manifest-path sed/Cargo.toml -- --check
          fi

  # Two lint legs share the job: the default-features check over the
  # affected crates (`clippy`), and the `ui` feature check over the crates
  # that embed the frontend (`ui-clippy`) — a web-ui-only diff runs just the
  # second leg.
  clippy:
    needs: scope
    if: ${{ !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.clippy == 'true' || needs.scope.outputs.ui-clippy == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      actions: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      # A rebuilt merge queue deletes its old group branches but leaves their
      # runs queued; such a run ends here instead of holding a runner.
      - name: Stop a superseded merge group
        if: github.event_name == 'merge_group'
        run: |
          if ! git ls-remote --exit-code "https://github.com/${{ github.repository }}" "${{ github.ref }}" > /dev/null; then
            echo "::error::${{ github.ref }} no longer exists; the merge queue superseded this group"
            exit 1
          fi
      - name: Free runner disk
        run: |
          sudo bash -c 'for dir in /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL; do
            mv "$dir" "/tmp/gc-$(basename "$dir")" 2>/dev/null || true
          done
          rm -rf /tmp/gc-* &'
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: water-rs/stow@main
      # The `ui` feature's build script builds and embeds web-ui with bun.
      - uses: ./.github/actions/install-bun
        if: needs.scope.outputs.ui-clippy == 'true'
      - name: bun install
        if: needs.scope.outputs.ui-clippy == 'true'
        working-directory: web-ui
        run: bun install --frozen-lockfile
      # rav1e's x86_64 assembly is built with nasm.
      - name: Install nasm
        if: runner.os == 'Linux' && runner.arch == 'X64' && (needs.scope.outputs.rust == 'true' || needs.scope.outputs.ui-clippy == 'true')
        uses: ./.github/actions/install-nasm
      - name: cargo clippy (default features)
        if: needs.scope.outputs.rust == 'true'
        run: cargo clippy --locked --profile ci-check --all-targets ${{ needs.scope.outputs.linux-package-args }} --timings -- -D warnings
      - name: cargo clippy (sed)
        if: needs.scope.outputs.sed == 'true'
        run: cargo clippy --locked --manifest-path sed/Cargo.toml --profile ci-check --all-targets -- -D warnings
      - name: cargo clippy (ui)
        if: needs.scope.outputs.ui-clippy == 'true'
        run: cargo clippy --locked --profile ci-check --all-targets --features ui ${{ needs.scope.outputs.ui-args }} --timings -- -D warnings
      - name: Upload cargo timings
        if: always() && (needs.scope.outputs.rust == 'true' || needs.scope.outputs.ui-clippy == 'true')
        uses: actions/upload-artifact@v4
        with:
          name: cargo-timings-clippy
          path: target/cargo-timings/
      - name: Report stow cache stats
        if: always()
        run: stow stats || true

  test-ubuntu:
    name: test (ubuntu-latest)
    needs: scope
    if: ${{ !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.test == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      # The test action retires superseded generations of the job's cache.
      actions: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Test runs pay for no DWARF debug info: panic locations come from
      # `#[track_caller]`, while line tables inflate every test executable,
      # overflow macOS's 16 MB compact unwind table, and bloat cache archives.
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
      # The scoped `-p` selection compiles only the affected crates' test
      # targets; the e2e artifacts upload only when the diff reaches the
      # daemon, agent runtime, sandbox or tools (`e2e` — they exist only in
      # an `--all-targets` build of the root package).
      - uses: ./.github/actions/test
        with:
          run-workspace: ${{ needs.scope.result != 'success' || needs.scope.outputs.rust == 'true' }}
          run-sed: ${{ needs.scope.result != 'success' || needs.scope.outputs.sed == 'true' }}
          cargo-flags: ${{ needs.scope.outputs.linux-cargo-flags }}
          upload-may: ${{ needs.scope.outputs.e2e }}
          verify-baseline-tools: ${{ needs.scope.outputs.e2e }}
          upload-e2e-bin: ${{ needs.scope.outputs.e2e }}

  # One macOS job covers the whole suite: a second macOS runner used to take
  # the integration tests, but the compile it paid twice costs more than the
  # parallelism it bought, and the two runners queued for the same scarce
  # macOS capacity. Baseline-tool verification rides this job on macOS the
  # way it does on Ubuntu.
  test-macos:
    name: test (macos-latest)
    needs: scope
    if: ${{ !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.test == 'true') }}
    runs-on: macos-latest
    timeout-minutes: 40
    permissions:
      contents: read
      actions: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # See test-ubuntu.
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
      # Same scoped selection as test-ubuntu, minus the Linux filtering.
      - uses: ./.github/actions/test
        with:
          run-workspace: ${{ needs.scope.result != 'success' || needs.scope.outputs.rust == 'true' }}
          run-sed: ${{ needs.scope.result != 'success' || needs.scope.outputs.sed == 'true' }}
          cargo-flags: ${{ needs.scope.outputs.cargo-flags }}
          upload-may: ${{ needs.scope.outputs.e2e }}
          verify-baseline-tools: ${{ needs.scope.outputs.e2e }}

  # Runs a command of a container session through `may exec` in a real
  # Docker container of the workspace image, and checks it runs at the
  # configured nice level, runs a prepared tool from the tools mount and
  # reaches May's IPC commands through the relayed endpoint, along with every
  # other test that pulls the workspace image. They run here, after
  # container-image has pushed the image for their tag and after test-ubuntu
  # has produced the test binary, which this job runs directly instead of
  # compiling the workspace a second time; the plain test jobs start without
  # waiting for either.
  container-acceptance:
    name: Container Acceptance
    needs: [scope, container-image, test-ubuntu]
    if: ${{ !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.acceptance == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Enable unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Free runner disk
        run: |
          sudo bash -c 'for dir in /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL; do
            mv "$dir" "/tmp/gc-$(basename "$dir")" 2>/dev/null || true
          done
          rm -rf /tmp/gc-* &'
      - uses: actions/checkout@v4
      - id: downloads
        uses: ./.github/actions/restore-test-downloads
      - name: Download the test binaries
        uses: actions/download-artifact@v4
        with:
          name: e2e-test-bin-linux-x64
          path: ${{ runner.temp }}/e2e-bin
      - name: Download the debug may
        uses: actions/download-artifact@v4
        with:
          name: may-debug-linux-x64
          path: ${{ runner.temp }}/may-bin
      - name: Unpack the test binaries
        run: |
          mkdir -p target/debug/deps
          tar -xzf "${{ runner.temp }}/e2e-bin/e2e-test-bin.tar.gz" -C target/debug/deps
          tar -xzf "${{ runner.temp }}/may-bin/may-debug.tar.gz" -C target/debug
      - name: Run the container tests
        run: |
          bin="$(find target/debug/deps -maxdepth 1 -type f -name 'terminal_first_e2e-*' | head -1)"
          "$bin" --ignored --exact --nocapture \
            a_container_command_runs_at_the_configured_nice_and_reaches_ipc \
            ui_stream_stop_mid_response_persists_partial_assistant_text_in_container \
            ui_chat_executes_terminal_and_terminal_input_round_trip_in_container \
            ui_chat_turns_on_one_session_prepare_tools_once_in_container \
            container_profile_inline_script_task_reads_its_trigger_file \
            container_profile_script_file_task_reads_its_trigger_file \
            container_and_local_commands_share_the_daemons_job_pool
      - name: Drop test-written shims before saving cache
        if: success() && steps.downloads.outputs.tools-hit != 'true' && github.ref == 'refs/heads/main'
        run: rm -rf "${{ steps.downloads.outputs.tools-path }}"/runtimes/*/shims
      - if: success() && steps.downloads.outputs.tools-hit != 'true' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.downloads.outputs.tools-path }}
          key: ${{ steps.downloads.outputs.tools-key }}

  web-ui:
    needs: scope
    if: ${{ !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.web_ui == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/install-bun
      - name: bun install
        working-directory: web-ui
        run: bun install --frozen-lockfile
      - name: typecheck
        working-directory: web-ui
        run: bunx tsc -b
      - name: lint
        working-directory: web-ui
        run: bun run lint
      - name: bun test
        working-directory: web-ui
        run: bun test

  result:
    # The one required check on `main`: green when every job it needs
    # succeeded or was skipped by the scope.
    name: CI result
    if: always()
    needs:
      - fmt
      - clippy
      - test-ubuntu
      - test-macos
      - container-image
      - container-acceptance
      - web-ui
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check job results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            if [ "$result" = failure ] || [ "$result" = cancelled ]; then
              echo "::error::a needed job ended $result"
              exit 1
            fi
          done
