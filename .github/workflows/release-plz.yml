name: Release PR

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  id-token: write
  actions: write

jobs:
  release-plz:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      # Mint a short-lived crates.io token from the GitHub OIDC identity
      # instead of a stored CARGO_REGISTRY_TOKEN. Trusted publishing is
      # configured per crate on crates.io; a crate that has never been
      # published cannot be configured, so the step stays non-blocking
      # until the first `cargo publish` bootstrap lands it.
      - uses: rust-lang/crates-io-auth-action@v1
        id: crates-io-auth
        continue-on-error: true
      - uses: MarcoIeni/release-plz-action@v0.5
        id: release-plz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
      # A tag pushed with the workflow's token starts no workflow, but a
      # workflow_dispatch it sends does: the cargo-dist workflow (release.yml,
      # `dispatch-releases`) builds and publishes the release of the tag.
      - name: Dispatch the release build
        if: steps.release-plz.outputs.releases_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASES: ${{ steps.release-plz.outputs.releases }}
        run: |
          set -euo pipefail
          tag=$(jq -r '.[] | select(.package_name == "may-agent") | .tag' <<< "${RELEASES}")
          test -n "${tag}"
          gh workflow run release.yml --ref "${tag}" -f tag="${tag}"
      # GitHub holds the pull request runs of a pull request the Actions bot
      # opened or pushed until they are approved, and the required
      # `CI result` reports on the pull request only from those runs.
      # Merging the release PR stays a person's step.
      - name: Approve the release PR's CI
        if: steps.release-plz.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMBER: ${{ fromJSON(steps.release-plz.outputs.pr).number }}
        run: bash .github/scripts/approve-held-runs.sh "${NUMBER}"

