name: PR Base Gate

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, edited]

permissions:
  checks: read

jobs:
  verify-source:
    name: PR source gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: main only accepts merges from dev
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: |
          if [ "${HEAD_REPO}" != "${BASE_REPO}" ]; then
            echo "::error::Pull requests into 'main' must come from this repository, not a fork."
            exit 1
          fi
          if [ "${HEAD_REF}" != "dev" ]; then
            echo "::error::Pull requests into 'main' are only allowed from 'dev'. Retarget this pull request at 'dev' instead."
            exit 1
          fi
          echo "'${HEAD_REF}' -> 'main': source branch allowed."

      # This check doubles as the single required check on main: instead of
      # pinning CI job names in the ruleset (which break on every rename), it
      # waits for every other check run on the PR's head and merge commits and
      # goes green only when all of them did.
      - name: wait for every other check on this PR to go green
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail
          deadline=$(( $(date +%s) + 3300 ))
          while :; do
            checks="$(
              {
                gh api --paginate "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/check-runs?per_page=100" \
                  --jq '.check_runs[] | {name, status, conclusion}'
                if [ -n "${MERGE_SHA:-}" ] && [ "${MERGE_SHA}" != "null" ]; then
                  gh api --paginate "repos/${GITHUB_REPOSITORY}/commits/${MERGE_SHA}/check-runs?per_page=100" \
                    --jq '.check_runs[] | {name, status, conclusion}'
                fi
              } | jq -s 'map(select(.name != "PR source gate"))'
            )"

            total=$(jq 'length' <<<"${checks}")
            failures="$(jq '[.[] | select(.status == "completed" and ((.conclusion == "success") or (.conclusion == "skipped") or (.conclusion == "neutral") | not))]' <<<"${checks}")"
            if [ "$(jq 'length' <<<"${failures}")" -gt 0 ]; then
              echo "::error::checks on this pull request did not pass:"
              jq -r '.[] | "- \(.name): \(.conclusion)"' <<<"${failures}"
              exit 1
            fi

            pending=$(jq '[.[] | select(.status != "completed")] | length' <<<"${checks}")
            if [ "${total}" -gt 0 ] && [ "${pending}" -eq 0 ]; then
              echo "all ${total} check(s) on this pull request have passed"
              exit 0
            fi

            if [ "$(date +%s)" -gt "${deadline}" ]; then
              if [ "${total}" -eq 0 ]; then
                echo "::error::timed out after 55 minutes and no check runs other than this gate were ever reported"
              else
                echo "::error::timed out after 55 minutes waiting for ${pending} check(s) to conclude"
                jq -r '.[] | select(.status != "completed") | "- \(.name): \(.status)"' <<<"${checks}"
              fi
              exit 1
            fi

            if [ "${total}" -eq 0 ]; then
              echo "no checks reported yet; waiting..."
            else
              echo "waiting on ${pending} check(s)..."
            fi
            sleep 30
          done
