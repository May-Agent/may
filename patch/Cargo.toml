[package]
name = "may-patch"
version = "0.1.1"
edition = "2024"
authors = ["Lexo Liu <me@lexo.cool>"]
description = "apply_patch: sandbox-executed compact contextual patch utility"
license = "MIT"
repository = "https://github.com/May-Agent/may"
readme = "README.md"
keywords = ["patch", "diff", "sandbox", "agent", "tooling"]
categories = ["command-line-utilities"]
publish = false

[dependencies]
askama = { version = "0.16", default-features = false, features = ["derive", "std"] }
thiserror = "2"

[[bin]]
name = "apply_patch"
path = "src/main.rs"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
