[package]
name = "may-harness"
version = "0.1.0"
edition = "2024"
description = "May's agent harness: the IPC command framework, working documents, host watch, OAuth provider helpers, scheduled-task triggers and self-update"
license = "MIT"
repository = "https://github.com/May-Agent/may"
publish = false
build = "build.rs"

[features]
# The `tasks.md` fixtures the workspace's `#[cfg(test)]` code builds.
testing = []
# Set by the cargo-dist release build (`dist-workspace.toml`): the binary is a
# release, so its update channel defaults to `stable` instead of `dev`.
release-build = ["may-config/release-build"]

[dependencies]
# The foundational wire types: call images, task rows, the log ring, ids.
may-protocol = { path = "../protocol" }
# The configuration layer: `MayConfig`, secrets, forge auth, host git.
may-config = { path = "../config" }
# The tasks.md parser `tasks_md` and `task_rows` build on.
may-tasks = { path = "../tasks" }
aither-agent = { version = "0.31.0" }
aither-codex = { version = "0.31.0" }
aither-copilot = { version = "0.31.0" }
aither-core = { version = "0.31.0" }
aither-mcp = { version = "0.31.0" }
aither-sandbox = { version = "0.31.0" }
aho-corasick = { version = "1.1.5", features = ["std", "perf-literal"] }
anyhow = "1"
arc-swap = { version = "1", features = ["weak"] }
askama = "0.16"
async-channel = "2"
async-fs = "2.1"
async-io = "2.6"
async-stream = "0.3"
base64 = "0.22"
blocking = "1"
bytes = "1"
chrono = "0.4"
cron = "0.15"
dirs = "6"
dunce = "1.0.5"
event-listener = "5"
executor-core = { version = "0.7", features = ["tokio"] }
flate2 = "1"
futures = { version = "0.3.34", default-features = false, features = ["std", "async-await"] }
futures-lite = "2.6"
getrandom = "0.4"
heel = { version = "0.10.1", default-features = false }
hex = { version = "0.4", default-features = false, features = ["alloc"] }
hmac = { version = "0.12", default-features = false }
jiff = { version = "0.2", features = ["serde"] }
libc = "0.2.191"
lzma-rust2 = { version = "0.24.0", default-features = false, features = ["std", "xz", "encoder"] }
regex = "1.12"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
schemars = { version = "1.0", features = ["derive"] }
semver = { version = "1.0.28", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
similar = "3"
skyzen = { version = "0.5.1" }
strsim = { version = "0.11", default-features = false }
subtle = { version = "2.6", default-features = false }
tar = "0.4"
tempfile = "3.24.0"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
url = "2"
utoipa = { version = "5.4", default-features = false, features = ["macros"] }
whatlang = { version = "0.18", default-features = false }
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
# The `serve_api` server the update tests run against.
may-protocol = { path = "../protocol", features = ["testing"] }
# `SecretStore::in_memory` and the other test fixtures.
may-config = { path = "../config", features = ["test-fixtures"] }
# The test budgets and wording the payload tests build output stores with.
aither-sandbox = { version = "0.31.0", features = ["test-util"] }
tokio = { version = "1", features = ["full"] }

[lints]
workspace = true
