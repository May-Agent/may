[package]
name = "may-sed"
version = "0.3.0"
edition = "2024"
authors = ["Lexo Liu <me@lexo.cool>"]
description = "The sed of sandboxed agent scripts: uutils sed that writes no file"
license = "MIT"
repository = "https://github.com/May-Agent/may"
readme = "README.md"
keywords = ["sed", "sandbox", "agent", "tooling"]
categories = ["command-line-utilities"]
publish = false

[dependencies]
askama = { version = "0.16", default-features = false, features = ["derive", "std"] }
clap = { version = "4", default-features = false, features = ["std"] }
# `--sandbox` refuses the `w`/`W`/`r`/`R`/`e` commands and the `s///w` and
# `s///e` flags while the script compiles, before any file is opened.
sed = { version = "0.3.0", default-features = false }

[[bin]]
name = "aither-sed"
path = "src/main.rs"

[dev-dependencies]
tempfile = "3"

# Standalone workspace so main-workspace edits never resolve or compile may-sed
# or its uucore dependency tree.
[workspace]

[lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"

[lints.clippy]
all = "warn"
style = "warn"
correctness = "warn"
complexity = "warn"
suspicious = "warn"
perf = "warn"
pedantic = "warn"
nursery = "warn"
cargo = "warn"
multiple_crate_versions = { level = "allow", priority = 1 }

[profile.ci-check]
inherits = "dev"
debug = false
incremental = false

[profile.artifact]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
strip = "symbols"
