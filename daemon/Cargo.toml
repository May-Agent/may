[package]
name = "may-daemon"
version = "0.1.1"
edition = "2024"
description = "The resident May daemon: agent loops, the task scheduler, and the REST/SSE API every client attaches to"
license = "MIT"
build = "build.rs"
repository = "https://github.com/May-Agent/may"
publish = false

[features]
default = ["vision-ocr"]
# Build and embed the `web-ui` production bundle the `gui` routes serve.
ui = []
# On-device native OCR (`waterkit-vision`) and conditional downscaling for text-dense images.
vision-ocr = ["may-media/vision-ocr", "may-agent-core/vision-ocr"]

[dependencies]
# The agent core: agents, tools, containers, sessions the daemon drives.
may-agent-core = { path = "../agent-core" }
# The foundational wire types the API and sessions share.
may-protocol = { path = "../protocol" }
# The daemon API client types the wire handlers reuse.
may-client = { path = "../client" }
# The configuration layer the API reads and writes.
may-config = { path = "../config" }
# The media layer: the virtual desktop and on-device OCR.
may-media = { path = "../media" }
# Aither framework
aither-core = { version = "0.31.0", default-features = false, features = ["std", "derive", "serde"] }
aither-agent = { version = "0.31.0", default-features = false, features = ["serde"] }
aither-connectivity = { version = "0.31.0", default-features = false }
aither-sandbox = { version = "0.31.0", default-features = false, features = ["code-folding", "connectivity", "jobserver"] }
aither-models = { version = "0.31.0", default-features = false }
aither-mcp = { version = "0.31.0", default-features = false, features = ["client", "http"] }
aither-copilot = { version = "0.31.0", default-features = false }
aither-codex = { version = "0.31.0", default-features = false }
heel = { version = "0.10.1", default-features = false }
# ACP agents as subagents (`/connect`); its CLI and second SQLite stay off.
acpsub = { git = "https://github.com/lexoliu/acpsub", branch = "dev", default-features = false }

# Async runtime
tokio = { version = "1", default-features = false, features = ["fs", "io-util", "macros", "net", "process", "rt", "rt-multi-thread", "signal", "sync", "time"] }
futures = { version = "0.3.34", default-features = false, features = ["std", "async-await"] }
futures-lite = { version = "2.6", default-features = false, features = ["race", "std"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await", "async-await-macro"] }
bytes = { version = "1", default-features = false, features = ["std"] }
event-listener = { version = "5", default-features = false, features = ["std"] }
executor-core = { version = "0.7", default-features = false, features = ["std", "tokio"] }
async-fs = { version = "2.1", default-features = false }
async-io = { version = "2.6", default-features = false }
async-net = { version = "2", default-features = false }
async-process = { version = "2.5", default-features = false }
async-channel = { version = "2", default-features = false, features = ["std"] }
async-lock = { version = "3", default-features = false, features = ["std"] }
blocking = { version = "1", default-features = false }

# Serialization
serde = { version = "1.0", default-features = false, features = ["std", "derive"] }
schemars = { version = "1.0", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
serde_yml = { version = "0.0.12", default-features = false }
rmp-serde = { version = "1.3", default-features = false }
toml = { version = "0.8", default-features = false, features = ["parse", "display"] }
dashmap = { version = "6", default-features = false }

# Utils
jiff = { version = "0.2", default-features = false, features = ["std", "tz-system", "tzdb-bundle-platform", "tzdb-zoneinfo", "tzdb-concatenated", "perf-inline", "serde"] }
shell-escape = { version = "0.1", default-features = false }
arc-swap = { version = "1", default-features = false, features = ["weak"] }
thiserror = { version = "2", default-features = false, features = ["std"] }
tracing = { version = "0.1", default-features = false, features = ["std", "attributes"] }
anyhow = { version = "1", default-features = false, features = ["std"] }
url = { version = "2", default-features = false, features = ["std"] }
dunce = { version = "1.0.5", default-features = false }
which = { version = "8", default-features = false }
tempfile = { version = "3.24.0", default-features = false, features = ["getrandom"] }
git2 = { version = "0.20.3", default-features = false }
rustix = { version = "1.1.6", default-features = false, features = ["std", "fs", "event", "stdio", "termios", "process"] }
libc = { version = "0.2", default-features = false, features = ["std"] }
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }
hmac = { version = "0.12", default-features = false }
subtle = { version = "2.6", default-features = false, features = ["std"] }
sha2 = { version = "0.10", default-features = false, features = ["std"] }
hex = { version = "0.4", default-features = false, features = ["alloc"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
fd-lock = { version = "4.0.4", default-features = false }
include_dir = { version = "0.7", default-features = false }
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
repo-search-client = { version = "0.0.10", default-features = false, features = ["launcher"] }

# Clipboard, image, and browser
base64 = { version = "0.22", default-features = false, features = ["std"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
p256 = { version = "0.13", default-features = false, features = ["arithmetic", "ecdsa", "pem", "std"] }

# HTTP and SSE plumbing
zenwave = { version = "0.12", git = "https://github.com/zen-rs/zenwave", branch = "main", default-features = false, features = ["hyper-backend", "rustls-ring", "ws", "http2", "http3"] }
hyper = { version = "1", default-features = false, features = ["server", "client", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
# hyper over futures-io streams, for daemon connections outside tokio
smol-hyper = { version = "0.1.1", default-features = false }
http-body-util = { version = "0.1", default-features = false }
mime = { version = "0.3", default-features = false }
mime_guess = { version = "2", default-features = false }

# Web server for `may gui`/`may rest`
skyzen = { version = "0.5.1", default-features = false, features = ["hyper", "json", "query", "sse", "openapi", "ws"] }
# The daemon serves the router itself and renders errors as skyzen does.
skyzen-core = { version = "0.2", default-features = false, features = ["std"] }
utoipa = { version = "5.4", default-features = false, features = ["macros"] }

# Logging
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "fmt", "ansi", "env-filter"] }

# Templating
askama = { version = "0.16", default-features = false, features = ["derive", "std"] }

[dev-dependencies]
may-agent-core = { path = "../agent-core", features = ["testing"] }
may-protocol = { path = "../protocol", features = ["testing"] }
# The fixture images the attachment tests render.
may-media = { path = "../media", features = ["testing"] }

[lints]
workspace = true
