[package]
name = "may-repo-search"
version = "0.1.0"
edition = "2024"
description = "May's repo-search daemon client: code, session and issue search"
license = "MIT"
repository = "https://github.com/May-Agent/may"
publish = false

[dependencies]
# The wire types and layout paths the daemon client shares.
may-protocol = { path = "../protocol" }
# The search outbox and repo-usage rows the indexer drains.
may-db = { path = "../db" }
# The pinned, hash-verified repo-search binary the client prepares.
may-tool-dist = { path = "../tool-dist" }
# The versioned wire protocol and platform launchers of the daemon.
repo-search-client = { version = "0.0.10", default-features = false, features = ["launcher"] }
async-channel = { version = "2", default-features = false, features = ["std"] }
async-io = { version = "2.6", default-features = false }
async-lock = { version = "3", default-features = false, features = ["std"] }
askama = { version = "0.16", default-features = false, features = ["derive", "std"] }
blocking = { version = "1", default-features = false }
dunce = { version = "1.0.5", default-features = false }
futures-lite = { version = "2.6", default-features = false, features = ["race", "std"] }
git2 = { version = "0.21.0", default-features = false }
jiff = { version = "1.0.3", default-features = false, features = ["std", "tz-system", "tzdb-bundle-platform", "tzdb-zoneinfo", "tzdb-concatenated", "perf-inline", "serde"] }
serde = { version = "1.0", default-features = false, features = ["std", "derive"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
thiserror = { version = "2", default-features = false, features = ["std"] }
tracing = { version = "0.1", default-features = false, features = ["std", "attributes"] }
utoipa = { version = "5.5", default-features = false, features = ["macros"] }

[dev-dependencies]
tempfile = { version = "3.24.0", default-features = false, features = ["getrandom"] }
tokio = { version = "1", default-features = false, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
