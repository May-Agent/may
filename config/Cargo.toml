[package]
name = "may-config"
version = "0.1.0"
edition = "2024"
description = "May's configuration layer: config.toml and everything it touches"
license = "MIT"
repository = "https://github.com/May-Agent/may"
publish = false
build = "build.rs"

[features]
default = []
# Set by the cargo-dist release build (`dist-workspace.toml`): the binary is a
# release, so its update channel defaults to `stable` instead of `dev`.
release-build = []
# The throwaway `test_user` fixture `commit_signing`'s tests sign with; a
# crate's `[dev-dependencies]` enable it for test builds.
test-fixtures = []

[dependencies]
# The foundational wire types: cache lifetimes, model selectors, secret
# scopes.
may-protocol = { path = "../protocol" }
# The tasks.md line limit `[limits] tasks_lines` defaults from.
may-tasks = { path = "../tasks" }
aither-agent = { version = "0.31.0" }
aither-core = { version = "0.31.0" }
aither-models = { version = "0.31.0" }
aither-sandbox = { version = "0.31.0", features = ["jobserver"] }
anyhow = "1"
arc-swap = { version = "1", features = ["weak"] }
async-channel = "2"
async-fs = "2.1"
async-io = "2.6"
async-lock = "3"
askama = "0.16"
base64 = "0.22"
blocking = "1"
clap = { version = "4.6.7", default-features = false, features = ["std", "derive"] }
dirs = "6"
dunce = "1.0.5"
executor-core = { version = "0.7", features = ["tokio"] }
fs_extra = "1.3"
futures = { version = "0.3.34", default-features = false, features = ["std", "async-await"] }
futures-lite = "2.6"
futures-util = "0.3"
getrandom = "0.4"
hex = { version = "0.4", default-features = false, features = ["alloc"] }
humantime = { version = "2.4", default-features = false }
include_dir = "0.7"
jiff = { version = "0.2", features = ["serde"] }
keyring = { version = "3", default-features = false, features = ["apple-native", "windows-native", "linux-native"] }
libc = "0.2.191"
percent-encoding = "2.3"
regex = "1.12"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rustix = { version = "1.1.6", default-features = false, features = ["std", "fs", "event", "stdio", "termios", "process"] }
schemars = { version = "1.0", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
skyzen = { version = "0.5.1" }
tempfile = "3.24.0"
thiserror = "2"
toml = "0.8"
tracing = "0.1"
url = "2"
utoipa = { version = "5.4", default-features = false, features = ["macros"] }
whatlang = { version = "0.18", default-features = false }
zenwave = "0.7"

[dev-dependencies]
may-protocol = { path = "../protocol", features = ["testing"] }
tokio = { version = "1", features = ["full"] }

[lints]
workspace = true
