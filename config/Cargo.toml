[package]
name = "may-config"
version = "0.1.0"
edition = "2024"
description = "May's configuration layer: config.toml and everything it touches"
license = "MIT"
repository = "https://github.com/May-Agent/may"
publish = false
build = "build.rs"

[features]
default = []
# Set by the cargo-dist release build (`dist-workspace.toml`): the binary is a
# release, so its update channel defaults to `stable` instead of `dev`.
release-build = []
# The throwaway `test_user` fixture `commit_signing`'s tests sign with; a
# crate's `[dev-dependencies]` enable it for test builds.
test-fixtures = []

[dependencies]
# The foundational wire types: cache lifetimes, model selectors, secret
# scopes.
may-protocol = { path = "../protocol" }
# The tasks.md line limit `[limits] tasks_lines` defaults from.
may-tasks = { path = "../tasks" }
aither-agent = { version = "0.31.0", default-features = false }
aither-core = { version = "0.31.0", default-features = false, features = ["std", "derive", "serde"] }
aither-models = { version = "0.31.0", default-features = false }
aither-sandbox = { version = "0.31.0", default-features = false, features = ["jobserver"] }
arc-swap = { version = "1", default-features = false, features = ["weak"] }
async-channel = { version = "2", default-features = false, features = ["std"] }
async-fs = { version = "2.1", default-features = false }
async-io = { version = "2.6", default-features = false }
async-lock = { version = "3", default-features = false, features = ["std"] }
askama = { version = "0.16", default-features = false, features = ["derive", "std"] }
base64 = { version = "0.23.1", default-features = false, features = ["std"] }
blocking = { version = "1", default-features = false }
clap = { version = "4.6.9", default-features = false, features = ["std", "derive"] }
dirs = { version = "7.0.0", default-features = false }
dunce = { version = "1.0.5", default-features = false }
executor-core = { version = "0.7", default-features = false, features = ["std", "tokio"] }
fs_extra = { version = "1.3", default-features = false }
futures = { version = "0.3.34", default-features = false, features = ["std", "async-await"] }
futures-lite = { version = "2.6", default-features = false, features = ["race", "std"] }
getrandom = { version = "0.4", default-features = false }
hex = { version = "0.4", default-features = false, features = ["alloc"] }
humantime = { version = "2.4", default-features = false }
include_dir = { version = "0.7", default-features = false }
jiff = { version = "1.0.3", default-features = false, features = ["std", "tz-system", "tzdb-bundle-platform", "tzdb-zoneinfo", "tzdb-concatenated", "perf-inline", "serde"] }
keyring = { version = "3", default-features = false, features = ["apple-native", "windows-native", "linux-native"] }
libc = { version = "0.2.191", default-features = false, features = ["std"] }
percent-encoding = { version = "2.3", default-features = false, features = ["std"] }
regex = { version = "1.13.2", default-features = false, features = ["std", "perf", "unicode"] }
rustix = { version = "1.1.6", default-features = false, features = ["std", "fs", "event", "stdio", "termios", "process"] }
schemars = { version = "1.0", default-features = false, features = ["derive", "std"] }
serde = { version = "1.0", default-features = false, features = ["std", "derive"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
sha2 = { version = "0.11.1", default-features = false }
skyzen = { version = "0.5.2", default-features = false, features = ["openapi"] }
tempfile = { version = "3.24.0", default-features = false, features = ["getrandom"] }
thiserror = { version = "2", default-features = false, features = ["std"] }
toml = { version = "1.2", default-features = false, features = ["parse", "display", "serde"] }
tracing = { version = "0.1", default-features = false, features = ["std", "attributes"] }
url = { version = "2.5.9", default-features = false, features = ["std"] }
utoipa = { version = "5.5", default-features = false, features = ["macros"] }
whatlang = { version = "0.18", default-features = false }
zenwave = { version = "0.12", git = "https://github.com/zen-rs/zenwave", branch = "main", default-features = false, features = ["hyper-backend", "rustls-ring", "ws", "http2", "http3"] }

[dev-dependencies]
may-protocol = { path = "../protocol", features = ["testing"] }
tokio = { version = "1", default-features = false, features = ["macros", "rt", "rt-multi-thread"] }

[lints]
workspace = true
