[package]
name = "may-client"
version = "0.1.0"
edition = "2024"
description = "May's client side: the daemon API client, sessions, issues, trust and the shared worker protocol"
license = "MIT"
repository = "https://github.com/May-Agent/may"
publish = false

[features]
default = []

[dependencies]
# The foundational wire types the API and sessions share.
may-protocol = { path = "../protocol" }
# The persisted store sessions, issues and clones read and write.
may-db = { path = "../db" }
# The configuration layer: `MayConfig`, secrets, forge auth.
may-config = { path = "../config" }
# The checkout-read and script policies shells carry.
may-command-policy = { path = "../command-policy" }
# The pinned tool distribution sandboxes prepare.
may-tool-dist = { path = "../tool-dist" }
# The agent harness: IPC commands, working documents, OAuth helpers.
may-harness = { path = "../harness" }
# The repo-search daemon client the search commands and indexers share.
may-repo-search = { path = "../repo-search" }
# The tasks.md parser sessions keep current.
may-tasks = { path = "../tasks" }
# The apply_patch parser the command reading mirrors.
may-patch = { path = "../patch" }
aither-agent = { version = "0.31.0", features = ["serde"] }
aither-core = { version = "0.31.0" }
aither-models = { version = "0.31.0" }
aither-sandbox = { version = "0.31.0", features = ["code-folding", "connectivity", "jobserver"] }
aither-mcp = { version = "0.31.0" }
anyhow = "1"
arc-swap = { version = "1", features = ["weak"] }
askama = "0.16"
async-channel = "2"
async-fs = "2.1"
async-io = "2.6"
async-lock = "3"
async-net = "2"
async-process = "2.5"
base64 = "0.22"
blocking = "1"
bytes = "1"
chrono = "0.4"
dashmap = "6"
dirs = "6"
dunce = "1.0.5"
event-listener = "5"
executor-core = { version = "0.7", features = ["tokio"] }
fd-lock = "4.0.4"
fs_extra = "1.3"
futures = { version = "0.3.34", default-features = false, features = ["std", "async-await"] }
futures-lite = "2.6"
futures-util = "0.3"
getrandom = "0.4"
git2 = "0.20.3"
heel = { version = "0.10.1", default-features = false }
http-body-util = "0.1"
humantime = { version = "2.4", default-features = false }
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
include_dir = "0.7"
jiff = { version = "0.2", features = ["serde"] }
mime_guess = "2"
percent-encoding = "2.3"
petname = "2"
reflink-copy = { version = "0.1.33", default-features = false }
regex = "1.12"
repo-search-client = { version = "0.0.10", default-features = false, features = ["launcher"] }
schemars = { version = "1.0", features = ["derive"] }
semver = { version = "1.0.28", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rustix = { version = "1.1.6", default-features = false, features = ["std", "fs", "event", "stdio", "termios", "process"] }
sha2 = "0.10"
serde_yml = "0.0.12"
shell-words = "1.1"
skyzen = { version = "0.5.1" }
smol-hyper = { version = "0.1.1", default-features = false }
strsim = { version = "0.11", default-features = false }
tempfile = "3.24.0"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
tracing = "0.1"
walkdir = "2"

bollard = "0.21"
mime = "0.3"
partial-json-fixer = "0.5"
libc = "0.2"
rmp-serde = "1.3"
hex = { version = "0.4", default-features = false, features = ["alloc"] }
url = "2"
utoipa = { version = "5.4", default-features = false, features = ["macros"] }
zenwave = "0.7"

[dev-dependencies]
may-protocol = { path = "../protocol", features = ["testing"] }
may-tool-dist = { path = "../tool-dist", features = ["test-fixtures"] }
may-config = { path = "../config", features = ["test-fixtures"] }

[lints]
workspace = true
