[package]
name = "may-client"
version = "0.1.0"
edition = "2024"
description = "May's client side: the daemon API client, sessions, issues, trust and the shared worker protocol"
license = "MIT"
repository = "https://github.com/May-Agent/may"
publish = false

[features]
default = []

[dependencies]
# The foundational wire types the API and sessions share.
may-protocol = { path = "../protocol" }
# The persisted store sessions, issues and clones read and write.
may-db = { path = "../db" }
# The configuration layer: `MayConfig`, secrets, forge auth.
may-config = { path = "../config" }
# The checkout-read and script policies shells carry.
may-command-policy = { path = "../command-policy" }
# The pinned tool distribution sandboxes prepare.
may-tool-dist = { path = "../tool-dist" }
# The agent harness: IPC commands, working documents, OAuth helpers.
may-harness = { path = "../harness" }
# The repo-search daemon client the search commands and indexers share.
may-repo-search = { path = "../repo-search" }
# The tasks.md parser sessions keep current.
may-tasks = { path = "../tasks" }
# The apply_patch parser the command reading mirrors.
may-patch = { path = "../patch" }
aither-agent = { version = "0.31.0", default-features = false, features = ["serde"] }
aither-core = { version = "0.31.0", default-features = false, features = ["std", "derive", "serde"] }
aither-sandbox = { version = "0.31.0", default-features = false, features = ["code-folding", "connectivity", "jobserver"] }
anyhow = { version = "1.0.105", default-features = false, features = ["std"] }
askama = { version = "0.16", default-features = false, features = ["derive", "std"] }
async-channel = { version = "2", default-features = false, features = ["std"] }
async-fs = { version = "2.1", default-features = false }
async-io = { version = "2.6", default-features = false }
async-lock = { version = "3", default-features = false, features = ["std"] }
async-process = { version = "2.5", default-features = false }
base64 = { version = "0.23.1", default-features = false, features = ["std"] }
blocking = { version = "1", default-features = false }
bytes = { version = "1.12.2", default-features = false, features = ["std"] }
dashmap = { version = "6", default-features = false }
dirs = { version = "7.0.0", default-features = false }
dunce = { version = "1.0.5", default-features = false }
executor-core = { version = "0.7", default-features = false, features = ["std", "tokio"] }
futures-lite = { version = "2.6", default-features = false, features = ["race", "std"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await", "async-await-macro"] }
git2 = { version = "0.21.0", default-features = false }
heel = { version = "0.10.1", default-features = false }
http-body-util = { version = "0.1", default-features = false }
hyper = { version = "1.13.0", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
include_dir = { version = "0.7", default-features = false }
jiff = { version = "1.0.3", default-features = false, features = ["std", "tz-system", "tzdb-bundle-platform", "tzdb-zoneinfo", "tzdb-concatenated", "perf-inline", "serde"] }
mime_guess = { version = "2", default-features = false }
reflink-copy = { version = "0.1.33", default-features = false }
repo-search-client = { version = "0.0.10", default-features = false, features = ["launcher"] }
schemars = { version = "1.0", default-features = false, features = ["derive", "std"] }
serde = { version = "1.0", default-features = false, features = ["std", "derive"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
rustix = { version = "1.1.6", default-features = false, features = ["std", "fs", "event", "stdio", "termios", "process"] }
sha2 = { version = "0.11.1", default-features = false }
serde_yml = { version = "0.0.13", default-features = false }
skyzen = { version = "0.5.2", default-features = false, features = ["openapi"] }
tempfile = { version = "3.24.0", default-features = false, features = ["getrandom"] }
thiserror = { version = "2", default-features = false, features = ["std"] }
tokio = { version = "1", default-features = false, features = ["fs", "macros", "net", "rt", "rt-multi-thread", "sync", "time"] }
toml = { version = "1.2", default-features = false, features = ["parse", "display", "serde"] }
tracing = { version = "0.1", default-features = false, features = ["std", "attributes"] }
walkdir = { version = "2.5.1", default-features = false }

bollard = { version = "0.21", default-features = false }
mime = { version = "0.3", default-features = false }
partial-json-fixer = { version = "0.5", default-features = false }
libc = { version = "0.2", default-features = false, features = ["std"] }
rmp-serde = { version = "1.3", default-features = false }
hex = { version = "0.4", default-features = false, features = ["alloc"] }
url = { version = "2.5.9", default-features = false, features = ["std"] }
utoipa = { version = "5.5", default-features = false, features = ["macros"] }
zenwave = { version = "0.12", git = "https://github.com/zen-rs/zenwave", branch = "main", default-features = false, features = ["hyper-backend", "rustls-ring", "ws", "http2", "http3"] }

[dev-dependencies]
may-protocol = { path = "../protocol", features = ["testing"] }
may-tool-dist = { path = "../tool-dist", features = ["test-fixtures"] }
may-config = { path = "../config", features = ["test-fixtures"] }

[lints]
workspace = true
