[package]
name = "may-command-policy"
version = "0.1.0"
edition = "2024"
description = "May's rules on what a terminal script may run, as aither script policies"
license = "MIT"
repository = "https://github.com/May-Agent/may"
publish = false

[dependencies]
# The command reading every shell policy is checked against.
may-protocol = { path = "../protocol" }
aither-agent = { version = "0.31.0", default-features = false }
aither-core = { version = "0.31.0", default-features = false, features = ["std", "derive", "serde"] }
aither-sandbox = { version = "0.31.0", default-features = false }
askama = { version = "0.16", default-features = false, features = ["derive", "std"] }
async-fs = { version = "2.1", default-features = false }
blocking = { version = "1", default-features = false }
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await", "async-await-macro"] }
regex = { version = "1.12", default-features = false, features = ["std", "perf", "unicode"] }
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
thiserror = { version = "2", default-features = false, features = ["std"] }
tracing = { version = "0.1", default-features = false, features = ["std", "attributes"] }

[dev-dependencies]
tempfile = { version = "3.24.0", default-features = false, features = ["getrandom"] }
tokio = { version = "1", default-features = false, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
