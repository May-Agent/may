[package]
name = "may-agent"
version = "0.1.0"
edition = "2024"
description = "May - A warm, boundaried AI assistant"
license = "MIT"
build = "build.rs"
repository = "https://github.com/May-Agent/may"
publish = false

[[bin]]
name = "may"
path = "src/bin/may/main.rs"

[features]
default = []
ui = []
gstreamer = ["dep:gstreamer", "dep:gstreamer-app", "dep:gstreamer-video"]

[dependencies]
# Aither framework
aither-core = { git = "https://github.com/lexoliu/aither", branch = "dev" }
aither-agent = { git = "https://github.com/lexoliu/aither", branch = "dev", features = ["mcp", "websearch", "webfetch", "skills"] }
aither-sandbox = { git = "https://github.com/lexoliu/aither", branch = "dev", features = ["code-folding"] }
aither-cloud = { git = "https://github.com/lexoliu/aither", branch = "dev" }
aither-rag = { git = "https://github.com/lexoliu/aither", branch = "dev" }
aither-copilot = { git = "https://github.com/lexoliu/aither", branch = "dev" }
aither-codex = { git = "https://github.com/lexoliu/aither", branch = "dev" }
aither-models = { git = "https://github.com/lexoliu/aither", branch = "dev" }
aither-mcp = { git = "https://github.com/lexoliu/aither", branch = "dev" }
aither-browser = { git = "https://github.com/lexoliu/aither", branch = "dev" }
aither-search = { git = "https://github.com/lexoliu/aither", branch = "dev" }

# Container runtime (Docker/OrbStack/Podman)
bollard = "0.21"
tar = "0.4"
flate2 = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }

# Async runtime
tokio = { version = "1", features = ["full"] }
futures-lite = "2.6"
futures-util = "0.3"
bytes = "1"
async-stream = "0.3"
event-listener = "5"
executor-core = { version = "0.7", features = ["tokio"] }
async-fs = "2.1"
async-io = "2.6"
humantime = { version = "2.4", default-features = false }
async-net = "2"
async-channel = "2"
blocking = "1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
schemars = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yml = "0.0.12"
rmp-serde = "1.3"
toml = "0.8"
dashmap = "6"
# Partial JSON repair for streaming tool-call argument projection.
partial-json-fixer = "0.5"

# Utils
jiff = { version = "0.2", features = ["serde"] }
uuid = { version = "1.0", features = ["v4"] }
petname = "2"
hostname = "0.4"
cron = "0.15"
chrono = "0.4"
shell-escape = "0.1"
shell-words = "1.1"
arc-swap = "1"
fastrand = "2"

# Web Push notifications
web-push = "0.11"
p256 = "0.13"
dirs = "6"
thiserror = "2"
tracing = "0.1"
anyhow = "1"
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Markdown parsing
# - streamdown-parser: incremental / streaming renderer for assistant output
# - pulldown-cmark: CommonMark AST parser for structured input (checklists,
#   prompt @-mentions, tasks.md, etc.) where one-shot correctness matters
#   more than streaming
streamdown-parser = "0.1"
pulldown-cmark = { version = "0.13", default-features = false }

# TUI
ratatui = { version = "0.30", features = ["scrolling-regions", "unstable-rendered-line-info"] }
crossterm = "0.28"
ratatui-image = { version = "10", default-features = false, features = ["crossterm"] }
unicode-width = "0.2"
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
ahash = "0.8"

# Clipboard, image, and browser
arboard = "3"
base64 = "0.22"
open = "5"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

# HTTP client for fetching images
zenwave = "0.7"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"

# Browser automation (CDP) and WebRTC live streaming
chromiumoxide = { version = "0.8", default-features = false, features = ["tokio-runtime"] }
chromiumoxide_fetcher = "0.9.1"
webrtc = "0.17"
openh264 = "0.9"

# GStreamer encoding (optional, runtime-detected, user installs GStreamer)
gstreamer = { version = "0.23", optional = true }
gstreamer-app = { version = "0.23", optional = true }
gstreamer-video = { version = "0.23", optional = true }

# Web server for `may ui`
skyzen = { version = "0.4", features = ["hyper"] }
utoipa = { version = "5.4", default-features = false, features = ["macros"] }
skyzen-services = { version = "0.2", default-features = false, features = ["runtime-tokio-rustls", "sqlite"] }

# File picker
nucleo = "0.5"
ignore = "0.4"

# Logging
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# Templating
askama = "0.16"

# Embedded resources
include_dir = "0.7"
itertools = "0.14.0"
tempfile = "3.24.0"
git2 = "0.20.3"
mime = "0.3"
mime_guess = "2"
rustls = { version = "0.23", features = ["ring"] }
regex = "1.12"
globset = "0.4"
notify = "8"
fs_extra = "1.3"
sqlparser = "0.58.0"
walkdir = "2"
sha2 = "0.10"

# Session retrieval index
# `remote` is required even for local-only use: lancedb 0.40's `job.rs`
# references `Error::Http` unconditionally, so the crate does not compile
# without it.
lancedb = { version = "0.40", default-features = false, features = ["remote"] }
lance-index = "13.0"
arrow-array = "58.4"
arrow-schema = "58.4"
similar = "3.1.1"
dunce = "1.0.5"
keyring = { version = "3", default-features = false, features = ["apple-native", "windows-native", "linux-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Direct NSPasteboard reads skip the decode-to-RGBA / re-encode round trip
# that arboard's get_image performs on every clipboard image.
objc2-app-kit = "0.3"
objc2-foundation = "0.3"

[dev-dependencies]
serial_test = "3"
tokio-test = "0.4"

[workspace.lints]
rust.missing_docs = "warn"
rust.missing_debug_implementations = "warn"
clippy.all = "warn"
clippy.style = "warn"
clippy.correctness = "warn"
clippy.complexity = "warn"
clippy.suspicious = "warn"
clippy.perf = "warn"
clippy.pedantic = "warn"
clippy.nursery = "warn"
clippy.cargo = "warn"
clippy.multiple_crate_versions =  { level = "allow", priority = 1 }
# A raw line-count cap fights the deliberately linear structure of the TUI draw
# and event-dispatch passes; splitting them at an arbitrary boundary adds
# indirection without a real abstraction.
clippy.too_many_lines = { level = "allow", priority = 1 }
# Flag groups appear naturally in serde wire structs and TUI state; packing
# them into bitflags/enums would obscure the declared shape.
clippy.struct_excessive_bools = { level = "allow", priority = 1 }
# serde's `skip_serializing_if` expects predicates of the form `fn(&T) -> bool`;
# the suggested by-value signature cannot satisfy that contract.
clippy.trivially_copy_pass_by_ref = { level = "allow", priority = 1 }
# u64 -> f64 casts in usage-metric rate calculations are intentional; the only
# conversion path is `as`, and counter magnitudes never approach 2^53.
clippy.cast_precision_loss = { level = "allow", priority = 1 }


[lints]
workspace = true

# Baseline tool preparation hashes and inflates ~120 MB of pinned tool
# artifacts before every agent is built; unoptimized, these crates make that
# take seconds in dev and test builds.
[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.zlib-rs]
opt-level = 3

[profile.dev.package.miniz_oxide]
opt-level = 3

[profile.dev.package.flate2]
opt-level = 3

[profile.dev.package.crc32fast]
opt-level = 3

[profile.dev.package.zip]
opt-level = 3

[profile.dev.package.tar]
opt-level = 3
