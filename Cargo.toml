[package]
name = "may-agent"
version = "0.1.1"
edition = "2024"
description = "May - A warm, boundaried AI assistant"
license = "MIT"
repository = "https://github.com/May-Agent/may"
publish = false

[[bin]]
name = "may"
path = "src/bin/may/main.rs"

# `publish = false` hides the package from cargo-dist unless it says so.
[package.metadata.dist]
dist = true

[workspace]
members = [".", "agent-core", "daemon", "tasks", "patch", "container-image", "protocol", "tool-dist", "config", "command-policy", "media", "harness", "db", "providers", "client", "tui", "repo-search", "git-forge"]
# `cargo build` also builds the `tasks` and `apply_patch` binaries (`may-sed`
# lives in its own `sed/` workspace so main-workspace edits never compile it).
default-members = [".", "agent-core", "daemon", "tasks", "patch", "container-image", "protocol", "tool-dist", "config", "command-policy", "media", "harness", "db", "providers", "client", "tui", "repo-search", "git-forge"]

[features]
default = ["vision-ocr"]
ui = ["may-daemon/ui", "may-tui/ui"]
# Set by the cargo-dist release build (`dist-workspace.toml`): the binary is a
# release, so its update channel defaults to `stable` instead of `dev`.
release-build = ["may-config/release-build", "may-harness/release-build"]
# On-device native OCR (`waterkit-vision`) and conditional downscaling for text-dense images.
vision-ocr = ["may-agent-core/vision-ocr", "may-daemon/vision-ocr"]

[dependencies]
# The agent core: the whole library surface except the daemon and the TUI.
may-agent-core = { path = "agent-core" }
# The resident daemon and its API.
may-daemon = { path = "daemon" }
# The terminal user interface.
may-tui = { path = "tui" }
# The `tasks.md` parser and the `tasks` command; the container image tag is
# derived from this crate's directory.
may-tasks = { path = "tasks" }
# SQLite persistence for sessions, messages, and app state.
may-db = { path = "db" }
# The media layer's permission helper the binary re-enters.
may-media = { path = "media" }
# Feature edge the release build's update channel reads.
may-config = { path = "config" }
# Feature edge the release build's update channel reads.
may-harness = { path = "harness" }
# Aither framework
aither-core = { version = "0.31.0", default-features = false, features = ["std", "derive", "serde"] }
aither-agent = { version = "0.31.0", default-features = false }
aither-sandbox = { version = "0.31.0", default-features = false }
aither-copilot = { version = "0.31.0", default-features = false }
aither-codex = { version = "0.31.0", default-features = false }
# Exact token counts (`LanguageModel::count_text`) for the decode meter.
aither-openai = { version = "0.31.0", default-features = false, features = ["tokenizer"] }

# repo-search daemon client; the daemon refuses a client of another version,
# so it is the version inside the v0.0.15 binary pinned in
# `tool-dist/src/host-programs.json`.
repo-search-client = { version = "0.0.10", default-features = false, features = ["launcher"] }

# Async runtime
tokio = { version = "1", default-features = false, features = ["fs", "io-util", "macros", "net", "process", "rt", "rt-multi-thread", "sync", "time"] }
futures-lite = { version = "2.6", default-features = false, features = ["race", "std"] }
bytes = { version = "1.12.2", default-features = false, features = ["std"] }
async-stream = { version = "0.3", default-features = false }
executor-core = { version = "0.7", default-features = false, features = ["std", "tokio"] }
async-fs = { version = "2.1", default-features = false }
async-io = { version = "2.6", default-features = false }
async-process = { version = "2.5", default-features = false }
async-channel = { version = "2", default-features = false, features = ["std"] }
blocking = { version = "1", default-features = false }

# Serialization
serde = { version = "1.0", default-features = false, features = ["std", "derive"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
toml = { version = "1.2", default-features = false, features = ["parse", "display", "serde"] }

# Utils
jiff = { version = "1.0.3", default-features = false, features = ["std", "tz-system", "tzdb-bundle-platform", "tzdb-zoneinfo", "tzdb-concatenated", "perf-inline", "serde"] }
libc = { version = "0.2.191", default-features = false, features = ["std"] }
dirs = { version = "7.0.0", default-features = false }
shell-escape = { version = "0.1", default-features = false }
arc-swap = { version = "1", default-features = false, features = ["weak"] }
thiserror = { version = "2", default-features = false, features = ["std"] }
tracing = { version = "0.1", default-features = false, features = ["std", "attributes"] }
anyhow = { version = "1.0.105", default-features = false, features = ["std"] }
zenwave = { version = "0.12", git = "https://github.com/zen-rs/zenwave", branch = "main", default-features = false, features = ["hyper-backend", "rustls-ring", "ws", "http2", "http3"] }
tempfile = { version = "3.24.0", default-features = false, features = ["getrandom"] }
git2 = { version = "0.21.0", default-features = false }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
dunce = { version = "1.0.5", default-features = false }
rustix = { version = "1.1.6", default-features = false, features = ["std", "fs", "event", "stdio", "termios", "process"] }
clap = { version = "4.6.9", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "suggestions"] }
clap_complete = { version = "4.6.12", default-features = false }
indicatif = { version = "0.18.6", default-features = false }

# TUI
ratatui = { version = "0.30", default-features = false, features = ["all-widgets", "crossterm", "layout-cache", "scrolling-regions", "unstable-rendered-line-info"] }
crossterm = { version = "0.29.0", default-features = false, features = ["bracketed-paste", "events", "windows"] }
arboard = { version = "3.7.0", default-features = false }
open = { version = "5", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
hyper = { version = "1.13.0", default-features = false, features = ["server", "client", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
http-body-util = { version = "0.1", default-features = false }

# Browser automation (CDP)
chromiumoxide = { version = "0.9.1", default-features = false }

# Logging
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "fmt", "ansi", "env-filter"] }

# Templating
askama = { version = "0.16", default-features = false, features = ["derive", "std"] }

[dev-dependencies]
# Test-support helpers the integration tests drive.
may-protocol = { path = "protocol", features = ["testing"] }
may-tool-dist = { path = "tool-dist", features = ["test-fixtures"] }
may-config = { path = "config", features = ["test-fixtures"] }
may-harness = { path = "harness", features = ["testing"] }
# Places jobs in a container or on a remote host for the memory guard's tests.
aither-sandbox = { version = "0.31.0", default-features = false, features = ["test-util"] }

[workspace.lints]
rust.missing_docs = "warn"
rust.missing_debug_implementations = "warn"
clippy.all = "warn"
clippy.style = "warn"
clippy.correctness = "warn"
clippy.complexity = "warn"
clippy.suspicious = "warn"
clippy.perf = "warn"
clippy.pedantic = "warn"
clippy.nursery = "warn"
clippy.cargo = "warn"
clippy.multiple_crate_versions =  { level = "allow", priority = 1 }
# A raw line-count cap fights the deliberately linear structure of the TUI draw
# and event-dispatch passes; splitting them at an arbitrary boundary adds
# indirection without a real abstraction.
clippy.too_many_lines = { level = "allow", priority = 1 }
# Flag groups appear naturally in serde wire structs and TUI state; packing
# them into bitflags/enums would obscure the declared shape.
clippy.struct_excessive_bools = { level = "allow", priority = 1 }
# serde's `skip_serializing_if` expects predicates of the form `fn(&T) -> bool`;
# the suggested by-value signature cannot satisfy that contract.
clippy.trivially_copy_pass_by_ref = { level = "allow", priority = 1 }
# u64 -> f64 casts in usage-metric rate calculations are intentional; the only
# conversion path is `as`, and counter magnitudes never approach 2^53.
clippy.cast_precision_loss = { level = "allow", priority = 1 }


[lints]
workspace = true

# Baseline tool preparation hashes and inflates ~120 MB of pinned tool
# artifacts before every agent is built; unoptimized, these crates make that
# take seconds in dev and test builds.
# The software AV1 encoder (hosts without a hardware encoder) is unusable
# unoptimized: seconds per 640x360 frame in dev and test builds. Its generic
# code is instantiated in mediax-codec, which needs the same level.
[profile.dev.package.rav1e]
opt-level = 3

[profile.dev.package.mediax-codec]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.zlib-rs]
opt-level = 3

[profile.dev.package.miniz_oxide]
opt-level = 3

[profile.dev.package.flate2]
opt-level = 3

[profile.dev.package.crc32fast]
opt-level = 3

[profile.dev.package.zip]
opt-level = 3

# Only used by `cargo build --profile artifact`, which builds the prebuilt
# `apply_patch` and `aither-sed` executables (`.github/scripts/build-artifact.sh`);
# panic stays `unwind` here so the profile works with the default build-std
# crates, and the script passes the panic strategy through the build.
[profile.artifact]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
strip = "symbols"

[profile.dev.package.tar]
opt-level = 3

[profile.dev.package.lzma-rust2]
opt-level = 3

# The check jobs compile nothing for debugging: clippy skips debuginfo and
# incremental state entirely, which halves what each check run carries.
[profile.ci-check]
inherits = "dev"
debug = false
incremental = false

# syntect parses and highlights each fenced code line of the TUI markdown
# tests through fancy-regex; at opt-level 0 those tests take 20-30 s each.
[profile.dev.package.syntect]
opt-level = 2

[profile.dev.package.fancy-regex]
opt-level = 2

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[patch.crates-io]
aither-acp = { git = "https://github.com/May-Agent/aither", branch = "main" }
aither-agent = { git = "https://github.com/May-Agent/aither", branch = "main" }
aither-attachments = { git = "https://github.com/May-Agent/aither", branch = "main" }
aither-browser = { git = "https://github.com/May-Agent/aither", branch = "main" }
aither-claude = { git = "https://github.com/May-Agent/aither", branch = "main" }
aither-cloud = { git = "https://github.com/May-Agent/aither", branch = "main" }
aither-codex = { git = "https://github.com/May-Agent/aither", branch = "main" }
aither-connectivity = { git = "https://github.com/May-Agent/aither", branch = "main" }
aither-copilot = { git = "https://github.com/May-Agent/aither", branch = "main" }
aither-core = { git = "https://github.com/May-Agent/aither", branch = "main" }
aither-dap = { git = "https://github.com/May-Agent/aither", branch = "main" }
aither-derive = { git = "https://github.com/May-Agent/aither", branch = "main" }
aither-gemini = { git = "https://github.com/May-Agent/aither", branch = "main" }
aither-mcp = { git = "https://github.com/May-Agent/aither", branch = "main" }
aither-models = { git = "https://github.com/May-Agent/aither", branch = "main" }
aither-openai = { git = "https://github.com/May-Agent/aither", branch = "main" }
aither-sandbox = { git = "https://github.com/May-Agent/aither", branch = "main" }
aither-skills = { git = "https://github.com/May-Agent/aither", branch = "main" }
aither-webfetch = { git = "https://github.com/May-Agent/aither", branch = "main" }
# The same git source aither-sandbox declares, so the patched `heel` shares
# one lockfile source with it and the `shim` feature unifies across both.
heel = { git = "https://github.com/May-Agent/heel.git", branch = "main" }
heel-shim = { git = "https://github.com/May-Agent/heel.git", branch = "main" }
# Preserves single `~` characters in inline text (upstream PR pending).
streamdown-parser = { git = "https://github.com/lexoliu/streamdown-rs", branch = "fix/preserve-single-tilde" }
