[package]
name = "may-agent"
version = "0.1.0"
edition = "2024"
description = "May - A warm, boundaried AI assistant"
license = "MIT"

[[bin]]
name = "may"
path = "src/bin/may.rs"

[dependencies]
# Aither framework
aither-core = { path = "../aither/core" }
aither-agent = { path = "../aither/agent", features = ["mcp", "websearch", "webfetch", "skills"] }
aither-sandbox = { path = "../aither/sandbox" }
aither-cloud = { path = "../aither/cloud" }
aither-copilot = { path = "../aither/copilot" }
aither-models = { path = "../aither/models" }
aither-mcp = { path = "../aither/mcp" }

# Leash sandbox
leash = { path = "../native-sandbox" }

# Async runtime
tokio = { version = "1", features = ["full"] }
futures-lite = "2.6"
async-stream = "0.3"
executor-core = { version = "0.7", features = ["tokio"] }
async-fs = "2.1"
async-channel = "2"
blocking = "1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
schemars = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yml = "0.0.12"
toml = "0.8"
quick-xml = { version = "0.37", features = ["serialize"] }

# Utils
jiff = { version = "0.2", features = ["serde"] }
uuid = { version = "1.0", features = ["v4"] }
petname = "2"
dirs = "6"
thiserror = "2"
tracing = "0.1"
anyhow = "1"
url = "2"

# Markdown parsing (incremental/streaming)
streamdown-parser = "0.1"

# TUI
ratatui = { version = "0.30", features = ["scrolling-regions", "unstable-rendered-line-info"] }
crossterm = "0.28"
ratatui-image = { version = "10", default-features = false, features = ["crossterm"] }
unicode-width = "0.2"
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
ahash = "0.8"

# Clipboard, image, and browser
arboard = "3"
base64 = "0.22"
open = "5"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

# HTTP client for fetching images
zenwave = { path = "../zenwave" }

# Web server for `may ui`
skyzen = { path = "../skyzen", features = ["hyper"] }

# File picker
nucleo = "0.5"
ignore = "0.4"

# Logging
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# Templating
askama = "0.15"

# Embedded resources
include_dir = "0.7"
itertools = "0.14.0"
tempfile = "3.24.0"
git2 = "0.20.3"
mime_guess = "2"

[dev-dependencies]
tokio-test = "0.4"
